<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Music Band - Star Kids</title>
<meta name="theme-color" content="#0b1030">
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" href="../assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b1030;--ink:#fff;--soft:#c9cdf5;--yellow:#ffd23f;--pink:#ff6b9d;--cyan:#4dd6ff;--green:#7ae582;--purple:#a78bfa;--orange:#ff9f43;
        --font:"Baloo 2","Chalkboard SE","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;--vh:100vh}
  @supports (height:100dvh){:root{--vh:100dvh}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior:none}
  body{background:radial-gradient(120% 70% at 50% 0%,#2f2a86 0%,var(--bg) 62%)}
  #sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  .app{position:relative;height:var(--vh);display:flex;flex-direction:column;
       padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px)}
  .top{display:flex;align-items:center;gap:8px;margin-bottom:8px;z-index:3}
  .title{flex:1;text-align:center;font-weight:800;font-size:clamp(20px,5.5vw,28px)}
  .btn{width:48px;height:48px;flex:none;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(20,24,70,.78);color:#fff;
       font-size:22px;display:grid;place-items:center;text-decoration:none;cursor:pointer}
  .btn:active{transform:scale(.92)}
  .view{display:none;flex:1;min-height:0;flex-direction:column;gap:10px}
  .view.on{display:flex}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
  .note-fx{position:absolute;font-size:28px;font-weight:800;transform:translate(-50%,-50%);animation:noteUp 1.1s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.4)}
  @keyframes noteUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1;transform:translate(-50%,-80%) scale(1.15)}
                    100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-420%) scale(.9) rotate(var(--rot))}}
  .seg{display:flex;align-self:center;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);border-radius:999px;padding:4px}
  .seg button{border:0;border-radius:999px;padding:8px 18px;font:800 17px var(--font);background:transparent;color:#fff;cursor:pointer}
  .seg button.on{background:var(--yellow);color:#1b1b3a}
  .hint{text-align:center;color:var(--soft);font-size:15px;margin:0}

  /* ---------- instrument menu ---------- */
  .menu{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-content:center;flex:1}
  @media (min-width:640px){.menu{grid-template-columns:repeat(3,1fr);gap:18px}}
  .inst{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:128px;border-radius:26px;border:0;cursor:pointer;
        color:#fff;font:800 20px var(--font);background:var(--c);background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 55%,#0b1030));
        box-shadow:inset 0 -6px 0 rgba(0,0,0,.2),0 10px 22px rgba(0,0,0,.35);transition:transform .15s}
  .inst:active{transform:scale(.94)}
  .inst span{font-size:50px;line-height:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
  .inst small{font:600 13px var(--font);opacity:.9}

  /* ---------- realistic instruments (drawn in code, notes live on the instrument) ---------- */
  .instbox{position:relative;flex:1;min-height:0;touch-action:none}
  .isvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 14px 22px rgba(0,0,0,.5))}
  .isvg *{pointer-events:none}
  .isvg .hit{pointer-events:all;cursor:pointer}
  .rot .lbl{transform-box:fill-box;transform-origin:center;transform:rotate(90deg)}
  .k .glow{opacity:0;transition:opacity .12s}
  .k.down .glow{opacity:.6}
  .wk,.bk,.bar{transition:transform .06s}
  .wk.down,.bk.down{transform:translateY(3px)}
  .bar.down{transform:translateY(3px)}
  .dot.down .glow,.sk.down .glow{opacity:1}
  .gstr.ring{animation:vib .3s linear 3}
  @keyframes vib{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.3px)}75%{transform:translateX(1.3px)}}
  .bowing .bow{animation:bowing .9s ease-in-out infinite alternate}
  @keyframes bowing{from{transform:translateX(-18px)}to{transform:translateX(18px)}}

  /* ---------- guitar chords ---------- */
  .chords{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:560px;width:100%;align-self:center}
  .chord{height:46px;border:0;border-radius:16px;font:800 20px var(--font);color:#fff;cursor:pointer;background:var(--k);
         box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.3);transition:transform .1s}
  .chord.minor{font-size:17px;filter:saturate(.75) brightness(.92)}
  .chord.sel{outline:4px solid #fff;outline-offset:2px}
  .chord:active{transform:scale(.93)}
  /* ---------- drums ---------- */
  .drums{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr) 1.2fr;gap:10px;touch-action:none;min-height:0}
  .pad{border-radius:24px;background:var(--k);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:clamp(15px,4vw,20px);
       box-shadow:inset 0 -7px 0 rgba(0,0,0,.25),0 8px 18px rgba(0,0,0,.35);transition:transform .07s;min-height:0}
  .pad span{font-size:clamp(30px,9vw,46px);line-height:1}
  .pad.down{transform:scale(.92);filter:brightness(1.3)}
  .tamb{grid-column:1/-1;display:grid;place-items:center;min-height:0}
  .tamb svg{height:100%;max-height:220px;width:auto;max-width:100%;transition:transform .08s;overflow:visible}
  .tamb.down svg{transform:rotate(-10deg) scale(.95)}
  @media (orientation:landscape) and (max-height:560px){.drums{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr}.tamb{grid-column:4;grid-row:1/span 2}}
  /* ---------- sax chords ---------- */
  .chordrow{display:flex;gap:8px;justify-content:center;touch-action:none}
  .nb{flex:1;max-width:150px;height:50px;border-radius:20px;background:var(--k);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;
      box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.3);transition:transform .07s}
  .nb.down{transform:scale(.93);filter:brightness(1.3);box-shadow:0 0 0 4px #fff,0 0 24px var(--k)}
  .voices{display:flex;gap:6px;justify-content:center;align-items:center;font-size:14px;color:var(--soft)}
  .voices i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.2)}
  .voices i.on{background:var(--green);box-shadow:0 0 10px var(--green)}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="app">
  <div class="top">
    <a class="btn" id="backBtn" href="../index.html" aria-label="Back">🏠</a>
    <div class="title" id="title">Music Band</div>
    <div class="btn" style="visibility:hidden"></div>
  </div>

  <!-- instrument menu -->
  <section class="view on" id="v-menu">
    <p class="hint">Pick an instrument!</p>
    <div class="menu">
      <button class="inst" data-go="piano" style="--c:#ff6b9d"><span>🎹</span>Piano<small>2 octaves, C to C</small></button>
      <button class="inst" data-go="xylo" style="--c:#ffd23f"><span>🪵</span>Xylophone<small>15 wooden bars</small></button>
      <button class="inst" data-go="guitar" style="--c:#ff9f43"><span>🎸</span>Guitar<small>15 notes + chords</small></button>
      <button class="inst" data-go="drums" style="--c:#4dd6ff"><span>🥁</span>Drums<small>+ tambourine</small></button>
      <button class="inst" data-go="sax" style="--c:#a78bfa"><span>🎷</span>Saxophone<small>15 keys</small></button>
      <button class="inst" data-go="violin" style="--c:#7ae582"><span>🎻</span>Violin<small>15 notes</small></button>
    </div>
  </section>

  <section class="view" id="v-piano"><p class="hint">Tap or slide across the keys</p><div class="instbox" id="piano"></div></section>
  <section class="view" id="v-xylo"><p class="hint">Tap the wooden bars</p><div class="instbox" id="xylo"></div></section>

  <section class="view" id="v-guitar">
    <div class="chords" id="chords"></div>
    <p class="hint">Tap the dots on the neck · slide across the strings to strum</p>
    <div class="instbox" id="guitar"></div>
  </section>

  <section class="view" id="v-drums"><div class="drums" id="drums"></div></section>

  <section class="view" id="v-sax">
    <div class="voices" id="saxVoices">Notes at once: <i></i><i></i><i></i></div>
    <div class="instbox" id="sax"></div>
    <div class="chordrow" id="saxChords"></div>
  </section>

  <section class="view" id="v-violin">
    <div class="seg" id="vMode"><button data-m="bow" class="on">🎻 Bow</button><button data-m="pluck">☝️ Pluck</button></div>
    <p class="hint">Hold a dot to play · cello, violin and harp together</p>
    <div class="instbox" id="violin"></div>
  </section>
</div>
<div id="fx"></div>

<script>
/* =====================================================
   AUDIO ENGINE (everything is made in code)
   ===================================================== */
let AC=null,MASTER=null,REV=null,NOISE=null;
function ac(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C({latencyHint:'interactive'});
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(AC.destination);
    MASTER=AC.createGain();MASTER.gain.value=.8;MASTER.connect(comp);
    const conv=AC.createConvolver(),len=AC.sampleRate*2.2,ir=AC.createBuffer(2,len,AC.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
    conv.buffer=ir;REV=AC.createGain();REV.gain.value=.22;REV.connect(conv);conv.connect(comp);}
  if(AC.state==='suspended')AC.resume();return AC;}
const hz=m=>440*Math.pow(2,(m-69)/12);
function out(node,wet){node.connect(MASTER);if(wet)node.connect(REV);}
function noiseBuf(){if(NOISE)return NOISE;const len=AC.sampleRate*2;NOISE=AC.createBuffer(1,len,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;return NOISE;}
/* plucked string (Karplus-Strong) — each buffer is made once and cached */
const ksCache=new Map();
function ksBuffer(f,dur,decay,bright){
  const key=f.toFixed(2)+'|'+dur+'|'+decay+'|'+bright;if(ksCache.has(key))return ksCache.get(key);
  const sr=AC.sampleRate,N=Math.max(2,Math.round(sr/f)),len=Math.floor(sr*dur),buf=AC.createBuffer(1,len,sr),d=buf.getChannelData(0),ring=new Float32Array(N);
  let prev=0;for(let i=0;i<N;i++){const w=Math.random()*2-1;prev=prev+(w-prev)*bright;ring[i]=prev;}
  let p=0,peak=0;for(let i=0;i<len;i++){const v=ring[p],nx=ring[(p+1)%N];d[i]=v;ring[p]=(v+nx)*.5*decay;p=(p+1)%N;if(Math.abs(v)>peak)peak=Math.abs(v);}
  const k=peak?.9/peak:1;for(let i=0;i<len;i++)d[i]*=k;ksCache.set(key,buf);return buf;}
function pluck(m,t,vol,opt={}){
  if(!ac())return;t=t||AC.currentTime;const s=AC.createBufferSource();s.buffer=ksBuffer(hz(m),opt.dur||2.6,opt.decay||.996,opt.bright||.6);
  const g=AC.createGain();g.gain.value=vol;const body=AC.createBiquadFilter();body.type='peaking';body.frequency.value=opt.body||220;body.gain.value=5;
  s.connect(body);body.connect(g);out(g,true);s.start(t);}
/* keyboard sounds */
function piano(m){const c=ac();if(!c)return;const t=c.currentTime,f=hz(m),g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';
  lp.frequency.setValueAtTime(5000,t);lp.frequency.exponentialRampToValueAtTime(1200,t+1.2);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.45,t+.006);g.gain.exponentialRampToValueAtTime(.12,t+.3);g.gain.exponentialRampToValueAtTime(.0001,t+2.2);
  [[1,'triangle',1],[2,'sine',.35],[3,'sine',.12],[4.01,'sine',.05]].forEach(([mul,type,v])=>{const o=c.createOscillator(),og=c.createGain();o.type=type;o.frequency.value=f*mul;og.gain.value=v;
    o.connect(og);og.connect(lp);o.start(t);o.stop(t+2.3);});lp.connect(g);out(g,true);}
function xylo(m){const c=ac();if(!c)return;const t=c.currentTime,f=hz(m);
  [[1,.5,1.1],[3.98,.12,.25],[9.2,.04,.08]].forEach(([mul,v,d])=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f*mul;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);out(g,true);o.start(t);o.stop(t+d+.05);});}
/* drums */
function env(g,t,v,d){g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);}
function noiseHit(t,type,freq,q,v,d){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf();f.type=type;f.frequency.value=freq;f.Q.value=q;
  env(g,t,v,d);s.connect(f);f.connect(g);out(g,true);s.start(t,Math.random());s.stop(t+d+.05);}
function toneHit(t,f1,f2,v,d,type){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d*.6);
  env(g,t,v,d);o.connect(g);out(g,false);o.start(t);o.stop(t+d+.05);}
const DRUM={
  kick:t=>{toneHit(t,160,42,1,.5);noiseHit(t,'lowpass',900,1,.15,.04);},
  snare:t=>{toneHit(t,220,170,.35,.15,'triangle');noiseHit(t,'highpass',1400,.7,.55,.22);},
  hat:t=>{noiseHit(t,'highpass',7500,1,.35,.06);},
  tom:t=>{toneHit(t,240,120,.8,.45);},
  clap:t=>{[0,.012,.026].forEach(d=>noiseHit(t+d,'bandpass',1500,1.2,.5,.08));noiseHit(t+.04,'bandpass',1400,1,.35,.2);},
  cymbal:t=>{noiseHit(t,'highpass',5200,.6,.4,1.3);noiseHit(t,'bandpass',9000,1.5,.25,.9);},
  tamb:t=>{for(let i=0;i<4;i++)noiseHit(t+i*.012,'bandpass',7000+Math.random()*2500,4,.35,.12);
    [5400,6300,7600].forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f+Math.random()*80;env(g,t,.025,.14);o.connect(g);out(g,true);o.start(t);o.stop(t+.2);});}
};
function drum(id){if(!ac())return;DRUM[id](AC.currentTime);}
/* held voices: sax and bowed strings */
function holdVoice(parts){ // parts: [{f,type,gain,lp,attack,vib,peak}]
  const c=AC,t=c.currentTime,nodes=[],master=c.createGain();master.gain.value=1;out(master,true);
  for(const p of parts){const o=c.createOscillator();o.type=p.type;o.frequency.value=p.f;if(p.detune)o.detune.value=p.detune;
    const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=p.lp;f.Q.value=p.q||1;let last=f;
    if(p.peak){const pk=c.createBiquadFilter();pk.type='peaking';pk.frequency.value=p.peak;pk.gain.value=7;pk.Q.value=1.2;f.connect(pk);last=pk;}
    const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(p.gain,t+p.attack);o.connect(f);last.connect(g);g.connect(master);
    if(p.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=p.vib;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(p.vibDepth||12,t+.45);
      l.connect(lg);lg.connect(o.detune);l.start(t);nodes.push(l);}
    o.start(t);nodes.push(o);}
  if(parts.breath){const s=c.createBufferSource(),bf=c.createBiquadFilter(),bg=c.createGain();s.buffer=noiseBuf();s.loop=true;bf.type='bandpass';bf.frequency.value=1600;bf.Q.value=.8;
    bg.gain.setValueAtTime(0,t);bg.gain.linearRampToValueAtTime(parts.breath,t+.05);s.connect(bf);bf.connect(bg);bg.connect(master);s.start(t);nodes.push(s);}
  return{stop(rel){const n=c.currentTime;master.gain.cancelScheduledValues(n);master.gain.setValueAtTime(master.gain.value,n);master.gain.linearRampToValueAtTime(0,n+(rel||.2));
    nodes.forEach(o=>{try{o.stop(n+(rel||.2)+.05);}catch(_){}});}};}

/* =====================================================
   COLORS follow the circle of fifths (C G D A E B F# ...)
   ===================================================== */
const SHORT=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const fifthPos=pc=>(pc*7)%12;
const hue=pc=>(fifthPos(pc)*30+340)%360;
const col=(pc,s=85,l=60)=>`hsl(${hue(pc)} ${s}% ${l}%)`;
const oct=m=>Math.floor(m/12)-1;

/* =====================================================
   FX: floating notes
   ===================================================== */
const fx=document.getElementById('fx');
function floatNote(x,y,color){const n=document.createElement('div');n.className='note-fx';n.textContent=['♪','♫','♩','★'][Math.floor(Math.random()*4)];
  n.style.left=x+'px';n.style.top=y+'px';n.style.color=color;n.style.setProperty('--dx',(Math.random()*80-40)+'px');n.style.setProperty('--rot',(Math.random()*60-30)+'deg');
  fx.appendChild(n);setTimeout(()=>n.remove(),1100);if(fx.childElementCount>40)fx.firstChild.remove();}
function fxAt(el,e,color){const r=el.getBoundingClientRect();floatNote(e&&e.clientX?e.clientX:r.left+r.width/2,(e&&e.clientY?e.clientY:r.top+r.height/2)-10,color);}

/* =====================================================
   MULTI-TOUCH: press, hold and slide across notes
   ===================================================== */
function track(box,sel,press,release){
  const cur=new Map();
  const at=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);const k=el&&el.closest(sel);return k&&box.contains(k)?k:null;};
  box.addEventListener('pointerdown',e=>{try{e.target.releasePointerCapture&&e.target.releasePointerCapture(e.pointerId);}catch(_){}
    const k=at(e);if(!k)return;e.preventDefault();ac();cur.set(e.pointerId,k);press(k,e);});
  box.addEventListener('pointermove',e=>{if(!cur.has(e.pointerId))return;const k=at(e),old=cur.get(e.pointerId);if(k===old)return;
    if(old&&release)release(old,e);cur.set(e.pointerId,k);if(k)press(k,e);});
  const up=e=>{if(!cur.has(e.pointerId))return;const old=cur.get(e.pointerId);cur.delete(e.pointerId);if(old&&release)release(old,e);};
  addEventListener('pointerup',up);addEventListener('pointercancel',up);
  return cur;
}
const flash=(el,ms)=>{el.classList.add('down');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('down'),ms||140);};

/* =====================================================
   INSTRUMENT DRAWINGS
   Each instrument is drawn once in its natural direction. If the screen fits it better turned
   sideways, the whole drawing is rotated (labels stay upright). Notes carry data-m (MIDI number).
   ===================================================== */
function mountInst(box,spec){let rot=null;
  const draw=()=>{const W=box.clientWidth,H=box.clientHeight;if(!W||!H)return;
    const s0=Math.min(W/spec.w,H/spec.h),s1=Math.min(W/spec.h,H/spec.w),r=s1>s0*1.1;if(r===rot)return;rot=r;
    box.innerHTML=`<svg class="isvg${r?' rot':''}" viewBox="0 0 ${r?spec.h:spec.w} ${r?spec.w:spec.h}" preserveAspectRatio="xMidYMid meet"><defs>${spec.defs}</defs>`+
      `<g${r?` transform="translate(0 ${spec.w}) rotate(-90)"`:''}>${spec.body}</g></svg>`;};
  if(window.ResizeObserver)new ResizeObserver(draw).observe(box);addEventListener('resize',draw);draw();}
// symmetric outline: left half as cubic segments from top-centre to bottom-centre, mirrored for the right half
function sym(cx,p0,segs){const m=x=>2*cx-x;let d=`M${p0[0]} ${p0[1]}`;segs.forEach(s=>d+=`C${s.join(' ')}`);
  for(let i=segs.length-1;i>=0;i--){const s=segs[i],st=i?segs[i-1].slice(4):p0;d+=`C${m(s[2])} ${s[3]} ${m(s[0])} ${s[1]} ${m(st[0])} ${st[1]}`;}return d+'Z';}
const LBL=(x,y,txt,size,fill)=>`<text class="lbl" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="${size}" font-weight="800" fill="${fill}" font-family="Baloo 2,system-ui,sans-serif">${txt}</text>`;
// round note dot used on guitar, violin
const DOT=(x,y,m,r,extra)=>{const pc=m%12;return `<g class="k dot" data-m="${m}" ${extra||''}><circle class="hit" cx="${x}" cy="${y}" r="${r+2.5}" fill="transparent"/>`+

   Chords in G from the circle of fifths: C — G — D and Am — Em — Bm
   ===================================================== */
const CHORDS={G:[43,47,50,55,59,67],C:[null,48,52,55,60,64],D:[null,null,50,57,62,66],Em:[40,47,52,55,59,64],Am:[null,45,52,57,60,64],Bm:[null,47,54,59,62,66]};

let gChord='G';

  const box=document.getElementById('guitar'),chordsEl=document.getElementById('chords');

    ['Am','Em','Bm'].map(c=>`<button class="chord minor" data-c="${c}" style="--k:${col(ROOT[c],70,50)}">${c}</button>`).join('');
  const GF=n=>82+390*(1-Math.pow(2,-n/20))/(1-Math.pow(2,-15/20));   // fret lines get closer up the neck
  const GX=s=>165-s*18;                                                // s=0 low E … s=5 high E
  const mid=n=>n?(GF(n-1)+GF(n))/2:66;
  // [string, fret, midi]
  const GN=[[3,0,55],[3,2,57],[3,4,59],[4,1,60],[4,3,62],[5,0,64],[5,2,66],[5,3,67],[5,5,69],[5,7,71],[5,8,72],[5,10,74],[5,12,76],[5,14,78],[5,15,79]];
  const body=sym(120,[120,436],[[72,436,18,450,14,516],[11,556,34,578,40,598],[46,618,16,650,12,720],[10,790,70,800,120,800]]);
  let b=`<g mask="url(#gFade)"><path d="${body}" fill="url(#gTop)" stroke="#f1e2c0" stroke-width="3"/>
    <path d="M150 596C176 590 198 616 192 660L150 668Z" fill="#3a1606" opacity=".85"/>
    <circle cx="120" cy="566" r="60" fill="none" stroke="#6b3a14" stroke-width="2"/><circle cx="120" cy="566" r="55" fill="none" stroke="#2a1408" stroke-width="7"/>

  [3,5,7,9,15].forEach(n=>b+=`<circle cx="120" cy="${mid(n)}" r="5" fill="#ece4d2" opacity=".85"/>`);
  b+=`<circle cx="101" cy="${mid(12)}" r="5" fill="#ece4d2" opacity=".85"/><circle cx="139" cy="${mid(12)}" r="5" fill="#ece4d2" opacity=".85"/>`;
  b+=`<path d="M68 78L60 16Q60 2 76 2L164 2Q180 2 180 16L172 78Z" fill="url(#gHead)" stroke="#1a0d05" stroke-width="2"/><rect x="62" y="76" width="116" height="7" rx="2" fill="#efe7d2"/>`;
  for(let k=0;k<3;k++){const y=18+k*20;
    b+=`<rect x="28" y="${y-7}" width="22" height="14" rx="6" fill="url(#gChrome)"/><rect x="48" y="${y-2}" width="14" height="4" fill="#b8b8c0"/>`+
       `<rect x="190" y="${y-7}" width="22" height="14" rx="6" fill="url(#gChrome)"/><rect x="178" y="${y-2}" width="14" height="4" fill="#b8b8c0"/>`+
       `<circle cx="90" cy="${y}" r="5" fill="#dcdce2" stroke="#777"/><circle cx="150" cy="${y}" r="5" fill="#dcdce2" stroke="#777"/>`;}
  const SW=[2.6,2.2,1.9,1.5,1.1,.9],post=s=>s<3?[150,58-s*20]:[90,18+(s-3)*20];
  for(let s=0;s<6;s++){const x=GX(s),c=s<4?'#d9b36c':'#e8e8ee',[px,py]=post(s);
    b+=`<line x1="${x}" y1="80" x2="${px}" y2="${py}" stroke="${c}" stroke-width="${SW[s]*.8}"/>`+
       `<g class="gstr" id="gs${s}"><line x1="${x+1.4}" y1="82" x2="${x+1.4}" y2="720" stroke="#000" stroke-width="${SW[s]}" opacity=".3"/>`+
       `<line x1="${x}" y1="80" x2="${x}" y2="720" stroke="${c}" stroke-width="${SW[s]}"/></g>`;}
  b+=`</g>`;
  GN.forEach(([s,n,m])=>b+=DOT(GX(s),mid(n),m,8.5,`data-str="${s}"`));
  for(let s=0;s<6;s++)b+=`<rect class="hit" data-s="${s}" x="${GX(s)-9}" y="500" width="18" height="200" fill="transparent"/>`;
  mountInst(box,{w:240,h:700,body:b,defs:`
    <radialGradient id="gTop" cx=".5" cy=".3" r=".75"><stop offset="0" stop-color="#f6cf86"/><stop offset=".5" stop-color="#e0a24e"/><stop offset=".82" stop-color="#a8601f"/><stop offset="1" stop-color="#4a220a"/></radialGradient>
    <radialGradient id="gHole"><stop offset="0" stop-color="#000"/><stop offset=".8" stop-color="#140902"/><stop offset="1" stop-color="#3a1e0a"/></radialGradient>

    <mask id="gFade" maskUnits="userSpaceOnUse" x="-60" y="-60" width="400" height="900"><rect x="-60" y="-60" width="400" height="900" fill="url(#gFadeG)"/></mask>`});
  const ring=s=>{const el=document.getElementById('gs'+s);if(!el)return;el.classList.remove('ring');void el.getBoundingClientRect();el.classList.add('ring');};
  function playString(s,t,vol){const m=CHORDS[gChord][s];
    if(m==null){pluck(52,t,.18,{dur:.15,decay:.9,bright:.3});return;}
    pluck(m,t,vol||.7,{bright:.7});setTimeout(()=>ring(s),Math.max(0,((t||AC.currentTime)-AC.currentTime)*1000));}
  function strum(){if(!ac())return;const t=AC.currentTime;[0,1,2,3,4,5].forEach((s,k)=>{if(CHORDS[gChord][s]!=null)playString(s,t+k*.028,.55);});

    const m=+k.dataset.m;pluck(m,0,.75,{bright:.55});ring(+k.dataset.str);flash(k,220);fxAt(k,e,col(m%12,90,70));});
  paint();
})();

  const glow=(m,on)=>document.querySelectorAll(`#v-sax [data-m="${m}"]`).forEach(el=>el.classList.toggle('down',on));
  const press=(k,e)=>{const m=+k.dataset.m;start(m,e.pointerId+'|'+m);glow(m,true);fxAt(k,e,col(m%12,90,70));};
  const release=(k,e)=>{const m=+k.dataset.m;stop(e.pointerId+'|'+m);if(!voices.some(v=>v.m===m))glow(m,false);};
  track(box,'[data-m]',press,release);
  track(chordsEl,'[data-ch]',(k,e)=>{k.classList.add('down');k.dataset.ch.split(',').forEach(m=>{start(+m,e.pointerId+'|c'+m);glow(+m,true);});fxAt(k,e,'#fff');},
    (k,e)=>{k.classList.remove('down');k.dataset.ch.split(',').forEach(m=>{stop(e.pointerId+'|c'+m);if(!voices.some(v=>v.m===+m))glow(+m,false);});});
  window.stopSax=()=>{while(voices.length)voices.pop().voice.stop(.1);show();document.querySelectorAll('#v-sax .down').forEach(x=>x.classList.remove('down'));};
})();

/* =====================================================
   VIOLIN: 15 finger spots on the four strings, G3 to G5
   (string band: cello stands out, violin, harp) — bow or pluck
   ===================================================== */
let vMode='bow';
(function(){
  const box=document.getElementById('violin');
  const xn=s=>120+(s-1.5)*20,xb=s=>120+(s-1.5)*26,X=(s,y)=>xn(s)+(xb(s)-xn(s))*(y-118)/404,Y=k=>134+k*34;
  // [string, semitones above open, midi]   strings: G D A E
  const VN=[[0,0,55],[0,2,57],[0,4,59],[0,5,60],[1,0,62],[1,2,64],[1,4,66],[1,5,67],[2,0,69],[2,2,71],[2,3,72],[2,5,74],[3,0,76],[3,2,78],[3,3,79]];
  const half=sym(120,[120,300],[[80,298,24,312,22,360],[21,385,30,402,40,410],[58,418,62,432,62,450],[62,468,56,482,38,492],[22,505,12,530,14,560],[16,610,70,640,120,640]]);
  let b=`<rect x="102" y="100" width="36" height="210" fill="#a85520"/>
    <path d="${half}" fill="url(#vVarnish)" stroke="#3a1404" stroke-width="3"/>
    <path d="${half}" fill="none" stroke="#2a0e02" stroke-width="1.3" opacity=".7" transform="translate(120 470) scale(.93) translate(-120 -470)"/>
    <ellipse cx="78" cy="380" rx="20" ry="42" fill="#fff" opacity=".09"/><ellipse cx="74" cy="565" rx="22" ry="40" fill="#fff" opacity=".07"/>
    <path d="M92 452C80 472 100 500 86 528M148 452C160 472 140 500 154 528" stroke="#1a0802" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="92" cy="450" r="4" fill="#1a0802"/><circle cx="86" cy="530" r="4" fill="#1a0802"/><circle cx="148" cy="450" r="4" fill="#1a0802"/><circle cx="154" cy="530" r="4" fill="#1a0802"/>
    <rect x="98" y="38" width="44" height="82" rx="10" fill="#9a4616" stroke="#3a1404" stroke-width="2"/><rect x="108" y="48" width="24" height="64" rx="6" fill="#2a0e02"/>
    <circle cx="120" cy="26" r="21" fill="url(#vVarnish)" stroke="#3a1404" stroke-width="2"/>
    <path d="M120 26m-12 0a12 12 0 1 1 12 12a8 8 0 1 1-8-8a4 4 0 1 1 4 4" fill="none" stroke="#3a1404" stroke-width="2.5"/>`;
  [[62,'L'],[94,'L'],[78,'R'],[108,'R']].forEach(([y,sd])=>b+=sd==='L'?`<rect x="64" y="${y-5}" width="40" height="10" rx="4" fill="#141414"/><ellipse cx="66" cy="${y}" rx="9" ry="12" fill="#1f1f1f"/>`
    :`<rect x="136" y="${y-5}" width="40" height="10" rx="4" fill="#141414"/><ellipse cx="174" cy="${y}" rx="9" ry="12" fill="#1f1f1f"/>`);
  b+=`<path d="M78 118L162 118L170 440Q120 452 70 440Z" fill="url(#vEbony)"/><rect x="77" y="114" width="86" height="6" rx="2" fill="#3a3a3a"/>`;
  [Y(2),Y(4),Y(5)].forEach(y=>{const d=8*(y-118)/322;b+=`<line x1="${78-d}" y1="${y}" x2="${162+d}" y2="${y}" stroke="#f4f0e6" stroke-width="3" opacity=".5"/>`;});
  b+=`<path d="M84 524L156 524Q150 510 120 506Q90 510 84 524Z" fill="url(#vMaple)" stroke="#8a6a3a"/>
    <path d="M100 540L140 540L132 628Q120 634 108 628Z" fill="#141414"/><circle cx="133" cy="550" r="3.5" fill="#d0d0d8"/>`;
  const SC=['#cfcfd6','#d8c9a0','#e7e7ec','#f4f4f8'],SW=[2.2,1.8,1.4,1];
  for(let s=0;s<4;s++)b+=`<polyline points="${120+(s-1.5)*6},${56+s*14} ${xn(s)},118 ${xb(s)},522 ${120+(s-1.5)*9},542" fill="none" stroke="${SC[s]}" stroke-width="${SW[s]}"/>`;
  b+=`<g class="bow"><path d="M-20 492L262 452" stroke="#5a2e12" stroke-width="4.5" stroke-linecap="round"/><path d="M-12 499L254 461" stroke="#efe6d2" stroke-width="3"/>
    <rect x="-28" y="486" width="22" height="16" rx="3" fill="#1a1a1a" transform="rotate(-8 -17 494)"/></g>`;
  VN.forEach(([s,k,m])=>b+=DOT(X(s,Y(k)),Y(k),m,9.5));
  mountInst(box,{w:240,h:650,body:b,defs:`
    <radialGradient id="vVarnish" cx=".5" cy=".45" r=".65"><stop offset="0" stop-color="#e08a3a"/><stop offset=".55" stop-color="#b3541a"/><stop offset="1" stop-color="#5a2008"/></radialGradient>
    <linearGradient id="vEbony" x1="0" x2="1"><stop offset="0" stop-color="#0a0a0a"/><stop offset=".5" stop-color="#2b2b2b"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient>
    <linearGradient id="vMaple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1d79e"/><stop offset="1" stop-color="#c99a52"/></linearGradient>`});
  const held=new Map();let bowing=0;
  function press(k,e){const m=+k.dataset.m,f=hz(m);k.classList.add('down');fxAt(k,e,col(m%12,90,70));ac();
    pluck(m+12,AC.currentTime+(vMode==='pluck'?.05:0),.32,{bright:.55,decay:.997,dur:2.4,body:900}); // harp
    if(vMode==='pluck'){pluck(m-12,0,.95,{bright:.4,decay:.994,dur:1.8,body:160});pluck(m,AC.currentTime+.01,.35,{bright:.5,decay:.992,dur:1.2,body:500});return;}
    const v=holdVoice([{f:f/2,type:'sawtooth',gain:.34,lp:1500,q:1.2,attack:.16,vib:5,vibDepth:10,peak:260},   // cello leads
                       {f:f/2,type:'triangle',gain:.12,lp:900,attack:.2},
                       {f,type:'sawtooth',gain:.09,lp:3400,attack:.22,vib:6,vibDepth:14,detune:3}]);           // violin
    held.set(e.pointerId+'|'+m,v);bowing++;box.classList.add('bowing');}
  function release(k,e){const m=+k.dataset.m,key=e.pointerId+'|'+m;k.classList.remove('down');const v=held.get(key);
    if(v){v.stop(.35);held.delete(key);bowing=Math.max(0,bowing-1);if(!bowing)box.classList.remove('bowing');}}
  track(box,'[data-m]',press,release);
  document.getElementById('vMode').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;vMode=b.dataset.m;
    document.querySelectorAll('#vMode button').forEach(x=>x.classList.toggle('on',x===b));});
  window.stopViolin=()=>{held.forEach(v=>v.stop(.1));held.clear();bowing=0;box.classList.remove('bowing');};
})();

/* =====================================================
   NAVIGATION between instruments (hash keeps your place)
   ===================================================== */
const TITLES={menu:'Music Band',piano:'🎹 Piano',xylo:'🪵 Xylophone',guitar:'🎸 Guitar',drums:'🥁 Drums',sax:'🎷 Saxophone',violin:'🎻 Violin'};
let view='menu';const backBtn=document.getElementById('backBtn');
function go(v){if(!TITLES[v])v='menu';view=v;document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  document.getElementById('title').textContent=TITLES[v];backBtn.textContent=v==='menu'?'🏠':'⬅';backBtn.setAttribute('aria-label',v==='menu'?'Home':'Back to instruments');
  backBtn.href=v==='menu'?'../index.html':'#';if(window.stopSax)stopSax();if(window.stopViolin)stopViolin();}
backBtn.addEventListener('click',e=>{if(view!=='menu'){e.preventDefault();history.replaceState(null,'','#');go('menu');}});
document.querySelector('.menu').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;ac();history.replaceState(null,'','#'+b.dataset.go);go(b.dataset.go);});
go(location.hash.slice(1)||'menu');
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(window.stopSax)stopSax();if(window.stopViolin)stopViolin();}});

/* stars */
(function(){const c=document.getElementById('sky'),x=c.getContext('2d');let W,H,st=[],last=0;
  function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
    st=Array.from({length:Math.round(W*H/3400)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.3,a:Math.random()*.5+.25,s:Math.random()<.2?Math.random()+.4:0,p:Math.random()*6}));}
  function f(t){requestAnimationFrame(f);if(document.hidden||t-last<70)return;last=t;x.clearRect(0,0,W,H);
    for(const s of st){x.globalAlpha=s.s?s.a*(.6+.4*Math.sin(t/1000*s.s+s.p)):s.a;x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill();}}
  addEventListener('resize',size);size();requestAnimationFrame(f);})();

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{}));
</script>
