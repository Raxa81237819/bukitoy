<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Planet Popper - Star Kids</title>
<meta name="theme-color" content="#0b1030">
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" href="../assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b1030;--ink:#fff;--soft:#c9cdf5;--yellow:#ffd23f;--pink:#ff6b9d;--green:#7ae582;
        --font:"Baloo 2","Chalkboard SE","Comic Sans MS","Trebuchet MS",system-ui,sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior:none;touch-action:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .top{position:fixed;z-index:3;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;
       padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;pointer-events:none}
  .top > *{pointer-events:auto}
  .btn{width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(20,24,70,.78);color:#fff;
       font-size:22px;display:grid;place-items:center;text-decoration:none;cursor:pointer}
  .btn:active{transform:scale(.92)}
  .score{padding:8px 18px;border-radius:999px;background:rgba(20,24,70,.85);border:2px solid rgba(255,255,255,.18);font-weight:800;font-size:22px;
         transition:transform .2s}
  .score.bump{transform:scale(1.25)}
  .hint{position:fixed;z-index:3;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 8px);text-align:center;font-weight:700;
        font-size:clamp(15px,4vw,19px);color:var(--soft);pointer-events:none;transition:opacity .5s}
  .hint.gone{opacity:0}
  .shout{position:fixed;z-index:4;left:50%;top:38%;transform:translate(-50%,-50%) scale(.5);font-weight:800;font-size:clamp(40px,12vw,76px);
         color:var(--yellow);text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 30px rgba(255,210,63,.6);opacity:0;pointer-events:none;white-space:nowrap}
  .shout.go{animation:shout 1.1s ease-out}
  .shout.sad{color:var(--pink);text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 30px rgba(255,107,157,.5)}
  @keyframes shout{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
                   70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(.95)}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="top">
  <a class="btn" href="../index.html" aria-label="Home">🏠</a>
  <div class="score" id="score">⭐ 0</div>
  <button class="btn" id="soundBtn" aria-label="Sound on or off">🔊</button>
</div>
<div class="hint" id="hint">👆 Pull the rock back, aim, and let go!</div>
<div class="shout" id="shout"></div>

<script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,rest={x:0,y:0},maxPull=140,astR=22;
let stars=[],planet=null,rock=null,drag=null,parts=[],score=0,nextSpawn=0,shots=0,shootStar=null,nextShoot=4000;

function size(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
  const m=Math.min(W,H);astR=Math.max(16,Math.min(26,m*.05));maxPull=Math.min(150,H*.2,W*.35);
  rest={x:W/2,y:H-Math.min(170,H*.24)};if(rock&&!rock.flying){rock.x=rest.x;rock.y=rest.y;}
  stars=Array.from({length:Math.round(W*H/2600)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.3,a:Math.random()*.6+.3,s:Math.random()<.2?Math.random()+.4:0,p:Math.random()*6}));}
addEventListener('resize',size);size();

/* ================= cached sprites ================= */
const spriteCache=new Map();
const TYPES=[
  {id:'earth',base:['#5ab8ff','#1f5fbf'],dots:'#3fbf5a'},{id:'mars',base:['#ff9a6b','#c2442a'],dots:'#9a3220'},
  {id:'jupiter',base:['#ffe2b8','#d08a55'],bands:['#c47a48','#f3d3a6','#b5653a']},{id:'saturn',base:['#ffe9a8','#d9a84f'],bands:['#e8c27a'],ring:true},
  {id:'neptune',base:['#7fb0ff','#2a49c9'],bands:['#3a62e0']},{id:'venus',base:['#fff1b8','#e0b050'],bands:['#f0cf7a']},
  {id:'moon',base:['#f1f1f1','#9a9aa6'],dots:'#8b8b97'},{id:'pluto',base:['#f2d7b8','#a87b58'],heart:true}
];
function planetSprite(t,r){
  const key=t.id+'|'+Math.round(r)+'|'+DPR;if(spriteCache.has(key))return spriteCache.get(key);
  const pad=t.ring?r*1.1:r*.2,S=Math.ceil((r+pad)*2*DPR),c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
  x.scale(DPR,DPR);const cx=r+pad,cy=r+pad;
  const ring=(front)=>{x.save();x.translate(cx,cy);x.rotate(-.35);x.beginPath();if(front)x.rect(-r*3,0,r*6,r*3);else x.rect(-r*3,-r*3,r*6,r*3);x.clip();
    x.lineWidth=r*.28;x.strokeStyle='#f6d58a';x.beginPath();x.ellipse(0,0,r*1.75,r*.5,0,0,6.283);x.stroke();
    x.lineWidth=r*.1;x.strokeStyle='#c99a4a';x.beginPath();x.ellipse(0,0,r*1.42,r*.4,0,0,6.283);x.stroke();x.restore();};
  if(t.ring)ring(false);
  x.save();x.beginPath();x.arc(cx,cy,r,0,6.283);x.clip();
  const g=x.createRadialGradient(cx-r*.35,cy-r*.35,r*.1,cx,cy,r*1.05);g.addColorStop(0,t.base[0]);g.addColorStop(1,t.base[1]);x.fillStyle=g;x.fillRect(0,0,S,S);
  if(t.bands)t.bands.forEach((b,i)=>{x.fillStyle=b;x.globalAlpha=.75;for(let k=0;k<3;k++){const y=cy-r+r*(.35+k*.6+i*.18);
    x.beginPath();x.moveTo(cx-r,y);for(let s=0;s<=10;s++)x.lineTo(cx-r+s*r/5,y+Math.sin(s*1.3+i)*r*.04);x.lineTo(cx+r,y+r*.12);x.lineTo(cx-r,y+r*.12);x.fill();}});
  x.globalAlpha=1;
  if(t.dots){x.fillStyle=t.dots;[[-.45,-.2,.28],[.35,.35,.22],[.1,-.55,.16],[-.2,.5,.14]].forEach(d=>{x.beginPath();x.arc(cx+d[0]*r,cy+d[1]*r,d[2]*r,0,6.283);x.fill();});}
  if(t.heart){x.fillStyle='#fff6ea';x.beginPath();const hx=cx+r*.3,hy=cy+r*.15,s=r*.32;x.moveTo(hx,hy+s);
    x.bezierCurveTo(hx-s*1.6,hy,hx-s*.6,hy-s*1.1,hx,hy-s*.35);x.bezierCurveTo(hx+s*.6,hy-s*1.1,hx+s*1.6,hy,hx,hy+s);x.fill();}
  const sh=x.createRadialGradient(cx-r*.5,cy-r*.5,r*.2,cx,cy,r);sh.addColorStop(.6,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,30,.35)');x.fillStyle=sh;x.fillRect(0,0,S,S);
  x.restore();
  // cute face
  x.fillStyle='#2b2140';const ex=r*.3,ey=cy-r*.08,er=r*.12;
  for(const s of[-1,1]){x.beginPath();x.ellipse(cx+s*ex,ey,er,er*1.25,0,0,6.283);x.fill();}
  x.fillStyle='#fff';for(const s of[-1,1]){x.beginPath();x.arc(cx+s*ex+er*.3,ey-er*.4,er*.38,0,6.283);x.fill();}
  x.strokeStyle='#2b2140';x.lineWidth=Math.max(2,r*.07);x.lineCap='round';x.beginPath();x.arc(cx,cy+r*.12,r*.2,.2,Math.PI-.2);x.stroke();
  x.fillStyle='rgba(255,120,160,.55)';for(const s of[-1,1]){x.beginPath();x.ellipse(cx+s*r*.55,cy+r*.18,r*.12,r*.07,0,0,6.283);x.fill();}
  if(t.ring)ring(true);
  const sp={c,S:S/DPR,ox:cx,oy:cy};spriteCache.set(key,sp);return sp;
}
function rockSprite(r){
  const key='rock|'+Math.round(r)+'|'+DPR;if(spriteCache.has(key))return spriteCache.get(key);
  const S=Math.ceil(r*2.4*DPR),c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');x.scale(DPR,DPR);const cx=r*1.2,cy=r*1.2;
  x.beginPath();for(let i=0;i<9;i++){const a=i/9*6.283,rr=r*(.85+.18*Math.sin(i*2.7));i?x.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a)):x.moveTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a));}x.closePath();
  const g=x.createRadialGradient(cx-r*.3,cy-r*.3,r*.1,cx,cy,r);g.addColorStop(0,'#c9b8a6');g.addColorStop(1,'#6e5a4b');x.fillStyle=g;x.fill();
  x.strokeStyle='#3d2f28';x.lineWidth=2.5;x.stroke();x.fillStyle='rgba(60,45,38,.55)';
  [[.3,-.2,.22],[-.3,.3,.18],[.15,.4,.12]].forEach(d=>{x.beginPath();x.arc(cx+d[0]*r,cy+d[1]*r,d[2]*r,0,6.283);x.fill();});
  const sp={c,S:S/DPR};spriteCache.set(key,sp);return sp;
}

/* ================= game flow ================= */
function newRock(){rock={x:rest.x,y:rest.y,vx:0,vy:0,flying:false,scale:1,spin:0};}
function spawn(){
  const t=TYPES[Math.floor(Math.random()*TYPES.length)],fromLeft=Math.random()<.5,r=Math.max(30,Math.min(62,Math.min(W,H)*.085));
  const top=Math.max(80,H*.14),bottom=Math.max(top+40,rest.y-maxPull-r*2.2);
  const speed=(60+Math.random()*70)*Math.max(.8,Math.min(1.6,W/500));const margin=r*(t.ring?2:1.2);
  planet={t,r,x:fromLeft?-margin:W+margin,y:top+Math.random()*(bottom-top),vx:fromLeft?speed:-speed,ph:Math.random()*6,bob:8+Math.random()*10,margin};
}
newRock();nextSpawn=performance.now()+600;

function burst(x,y,t){
  const cols=[t.base[0],t.base[1],...(t.bands||[]),t.dots||'#ffd23f','#ffd23f','#ffffff'];
  for(let i=0;i<46;i++){const a=Math.random()*6.283,s=120+Math.random()*420;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:.6+Math.random()*.7,size:3+Math.random()*7,col:cols[i%cols.length],star:i%5===0,rot:Math.random()*6});}
  parts.push({ring:true,x,y,r:10,life:1});
}
function shout(text,sad){const el=document.getElementById('shout');el.textContent=text;el.className='shout'+(sad?' sad':'');void el.offsetWidth;el.classList.add('go');}
function addScore(){score++;const s=document.getElementById('score');s.textContent='⭐ '+score;s.classList.add('bump');setTimeout(()=>s.classList.remove('bump'),200);
  try{localStorage.setItem('sk-popper-best',Math.max(score,+localStorage.getItem('sk-popper-best')||0));}catch(_){}}

/* ================= input: pull and release ================= */
cv.addEventListener('pointerdown',e=>{
  if(!rock||rock.flying)return;audio();
  if(Math.hypot(e.clientX-rest.x,e.clientY-rest.y)>Math.max(90,astR*4))return;
  drag={id:e.pointerId};cv.setPointerCapture(e.pointerId);stretchSound();moveRock(e);
});
cv.addEventListener('pointermove',e=>{if(drag&&e.pointerId===drag.id)moveRock(e);});
function moveRock(e){let dx=e.clientX-rest.x,dy=e.clientY-rest.y;const d=Math.hypot(dx,dy);if(d>maxPull){dx*=maxPull/d;dy*=maxPull/d;}
  rock.x=rest.x+dx;rock.y=rest.y+dy;}
function release(e){if(!drag||e.pointerId!==drag.id)return;drag=null;
  const dx=rest.x-rock.x,dy=rest.y-rock.y,d=Math.hypot(dx,dy);
  if(d<18){rock.x=rest.x;rock.y=rest.y;return;}
  const power=Math.max(8,1700/maxPull);rock.vx=dx*power;rock.vy=dy*power;rock.flying=true;shots++;whoosh();
  if(shots>=2)document.getElementById('hint').classList.add('gone');}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);

/* ================= loop ================= */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;if(document.hidden)return;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#141a5c');bg.addColorStop(1,'#0b1030');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(const s of stars){ctx.globalAlpha=s.s?s.a*(.6+.4*Math.sin(now/1000*s.s+s.p)):s.a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();}
  ctx.globalAlpha=1;
  if(!shootStar&&now>nextShoot)shootStar={x:W*(.4+Math.random()*.5),y:H*Math.random()*.25,life:1};
  if(shootStar){shootStar.x-=dt*700;shootStar.y+=dt*300;shootStar.life-=dt*1.2;const g=ctx.createLinearGradient(shootStar.x,shootStar.y,shootStar.x+110,shootStar.y-47);
    g.addColorStop(0,'rgba(255,255,255,'+Math.max(0,shootStar.life)+')');g.addColorStop(1,'rgba(255,255,255,0)');ctx.strokeStyle=g;ctx.lineWidth=2;ctx.beginPath();
    ctx.moveTo(shootStar.x,shootStar.y);ctx.lineTo(shootStar.x+110,shootStar.y-47);ctx.stroke();if(shootStar.life<=0){shootStar=null;nextShoot=now+7000+Math.random()*8000;}}
  // ground hill
  ctx.fillStyle='#2b3180';ctx.beginPath();ctx.ellipse(W/2,H+H*.05,W*.8,H*.17,0,0,6.283);ctx.fill();
  ctx.fillStyle='#3a41a0';ctx.beginPath();ctx.ellipse(W/2,H+H*.08,W*.6,H*.14,0,0,6.283);ctx.fill();

  // planet
  if(!planet&&now>nextSpawn)spawn();
  if(planet){planet.x+=planet.vx*dt;const py=planet.y+Math.sin(now/600+planet.ph)*planet.bob;
    const sp=planetSprite(planet.t,planet.r);ctx.drawImage(sp.c,planet.x-sp.ox,py-sp.oy,sp.S,sp.S);planet.cy=py;
    if((planet.vx>0&&planet.x-planet.margin>W)||(planet.vx<0&&planet.x+planet.margin<0)){planet=null;nextSpawn=now+500;}}

  // slingshot: back band, rock, front band
  const forkY=rest.y-8,lx=rest.x-astR*2.2,rx=rest.x+astR*2.2,wood='#8a5a2b';
  ctx.lineCap='round';ctx.strokeStyle=wood;ctx.lineWidth=16;ctx.beginPath();ctx.moveTo(rest.x,rest.y+110);ctx.lineTo(rest.x,rest.y+40);
  ctx.quadraticCurveTo(rest.x,rest.y+10,lx,forkY-30);ctx.moveTo(rest.x,rest.y+40);ctx.quadraticCurveTo(rest.x,rest.y+10,rx,forkY-30);ctx.stroke();
  ctx.strokeStyle='#b07a3f';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(rest.x-4,rest.y+108);ctx.lineTo(rest.x-4,rest.y+44);ctx.stroke();
  const band=(tx,ty)=>{ctx.strokeStyle='#ff6b9d';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(rock.flying?rest.x:rock.x,rock.flying?rest.y:rock.y);ctx.stroke();};
  if(rock)band(rx,forkY-30);
  // aim guide
  if(drag){const dx=rest.x-rock.x,dy=rest.y-rock.y,d=Math.hypot(dx,dy);if(d>18){const ux=dx/d,uy=dy/d;
    for(let i=1;i<=9;i++){const k=i*(18+d*.35);ctx.globalAlpha=1-i/10;ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(rest.x+ux*k,rest.y+uy*k,5-i*.35,0,6.283);ctx.fill();}ctx.globalAlpha=1;}}
  // rock
  if(rock){
    if(rock.flying){rock.x+=rock.vx*dt;rock.y+=rock.vy*dt;rock.scale=Math.max(.55,rock.scale-dt*.35);rock.spin+=dt*8;
      if(planet&&Math.hypot(rock.x-planet.x,rock.y-planet.cy)<planet.r+astR*rock.scale*.8){
        burst(planet.x,planet.cy,planet.t);popSound();addScore();shout(score%5===0?'Super! 🌟':['Pop!','Yay!','Boom!','Wow!'][Math.floor(Math.random()*4)]);
        if(score%5===0)speak('Super! You popped '+score+' planets!');planet=null;nextSpawn=now+900;newRock();}
      else if(rock.x<-80||rock.x>W+80||rock.y<-80||rock.y>H+80){uhOh();newRock();}}
    const rs=rockSprite(astR);if(rock){ctx.save();ctx.translate(rock.x,rock.y);ctx.rotate(rock.spin);const s=rs.S*rock.scale;ctx.drawImage(rs.c,-s/2,-s/2,s,s);ctx.restore();}
  }
  if(rock&&!rock.flying)band(lx,forkY-30);
  // particles
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt*(p.decay||1.6);if(p.life<=0){parts.splice(i,1);continue;}ctx.globalAlpha=Math.max(0,p.life);
    if(p.ring){p.r+=dt*420;ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.stroke();continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=dt*260;p.vx*=.99;p.rot+=dt*5;ctx.fillStyle=p.col;
    if(p.star){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5,rr=k%2?p.size*.5:p.size*1.4;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.fill();ctx.restore();}
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,6.283);ctx.fill();}}
  ctx.globalAlpha=1;
  // first-time hand hint
  if(shots===0&&!drag){const k=(now/1000)%1.6/1.6,py=rest.y+Math.sin(k*Math.PI)*maxPull*.6;ctx.font='38px serif';ctx.textAlign='center';ctx.globalAlpha=.9;ctx.fillText('👆',rest.x+18,py+42);ctx.globalAlpha=1;}
}
requestAnimationFrame(frame);

/* ================= sounds ================= */
let AC=null,soundOn=true,nb=null;try{soundOn=localStorage.getItem('sk-popper-sound')!=='off';}catch(_){}
function audio(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function noise(){if(nb)return nb;const len=AC.sampleRate;nb=AC.createBuffer(1,len,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;return nb;}
function tone(f,t,d,type,v,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05);}
function stretchSound(){if(!audio()||!soundOn)return;tone(180,AC.currentTime,.25,'triangle',.12,320);}
function whoosh(){if(!audio()||!soundOn)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noise();f.type='bandpass';f.Q.value=2;
  f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(2400,t+.3);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+.4);}
function popSound(){if(!audio()||!soundOn)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noise();f.type='lowpass';
  f.frequency.setValueAtTime(3000,t);f.frequency.exponentialRampToValueAtTime(200,t+.3);g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+.45);
  tone(520,t,.25,'sine',.35,90);[784,988,1175,1568].forEach((n,i)=>tone(n,t+.12+i*.07,.4,'sine',.14));}
let voiceCache=null;
function voice(){if(voiceCache)return voiceCache;const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];const en=vs.filter(v=>/^en/i.test(v.lang));
  for(const p of['Google UK English Female','Samantha','Microsoft Ava','Microsoft Jenny','Microsoft Aria','Karen','Tessa','Moira','Zira','Google US English']){const v=en.find(v=>v.name.includes(p));if(v)return voiceCache=v;}
  return voiceCache=en.find(v=>/female/i.test(v.name))||en[0]||null;}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{voiceCache=null;};
function speak(text,pitch){if(!soundOn||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=voice();if(v){u.voice=v;u.lang=v.lang;}
  u.pitch=pitch||1.2;u.rate=1;speechSynthesis.speak(u);}
function uhOh(){shout('Uh-oh!',true);if(navigator.vibrate)navigator.vibrate(60);if(!audio()||!soundOn)return;const t=AC.currentTime;
  tone(659,t,.28,'triangle',.22,640);tone(523,t+.3,.45,'triangle',.22,480);speak('Uh-oh!',1.4);}

const soundBtn=document.getElementById('soundBtn');const paint=()=>soundBtn.textContent=soundOn?'🔊':'🔇';paint();
soundBtn.onclick=()=>{soundOn=!soundOn;paint();try{localStorage.setItem('sk-popper-sound',soundOn?'on':'off');}catch(_){}};

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{}));
</script>
