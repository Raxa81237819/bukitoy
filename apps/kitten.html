<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Talking Kitten - Star Kids</title>
<meta name="theme-color" content="#0b1030">
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" href="../assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preload" as="image" href="../assets/kitten/kitten-sit.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b1030;--ink:#fff;--soft:#c9cdf5;--yellow:#ffd23f;--pink:#ff6b9d;--cyan:#4dd6ff;--green:#7ae582;--purple:#a78bfa;
        --font:"Baloo 2","Chalkboard SE","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;--vh:100vh}
  @supports (height:100dvh){:root{--vh:100dvh}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior:none}
  body{background:radial-gradient(120% 70% at 50% 10%,#2a2f86 0%,var(--bg) 62%)}
  img{-webkit-user-drag:none;user-drag:none}
  #sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  .app{position:relative;height:var(--vh);display:flex;flex-direction:column;align-items:center;
       padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px)}
  .top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:3}
  .btn{width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(20,24,70,.78);color:#fff;
       font-size:22px;display:grid;place-items:center;text-decoration:none;cursor:pointer}
  .btn:active{transform:scale(.92)}
  .title{font-weight:800;font-size:clamp(20px,5.5vw,28px)}
  .stage{position:relative;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:10px}
  .bubble{position:relative;z-index:4;max-width:min(90vw,460px);min-height:48px;padding:10px 20px;border-radius:24px;background:#fff;color:#2b2140;
          font-size:clamp(18px,5vw,24px);font-weight:700;text-align:center;line-height:1.2;box-shadow:0 8px 24px rgba(0,0,0,.35);
          transform:scale(.6);opacity:0;transition:transform .25s cubic-bezier(.3,1.6,.6,1),opacity .2s}
  .bubble.show{transform:scale(1);opacity:1}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-12px;border:12px solid transparent;border-bottom:0;border-top-color:#fff}

  /* ----- the photo kitten ----- */
  .kitwrap{position:relative;width:min(86vw,calc(var(--vh)*.46),420px);aspect-ratio:3/4;flex:none}
  #frame{position:absolute;inset:0;border-radius:28px;overflow:hidden;background:#cbb193;touch-action:none;cursor:pointer;
         border:4px solid rgba(255,255,255,.85);box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 0 6px rgba(167,139,250,.25)}
  #rig{position:absolute;inset:0;transform-origin:50% 95%}
  #breathe{position:absolute;inset:0;transform:scale(1.05);transform-origin:50% 90%;animation:breathe 3.6s ease-in-out infinite}
  .pose{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .28s}
  .pose.on{opacity:1}
  .ov{position:absolute;pointer-events:none}
  .lid{border-radius:50%;overflow:hidden;clip-path:inset(0 0 100% 0);transition:clip-path .07s linear;
       -webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent 100%);mask-image:radial-gradient(closest-side,#000 72%,transparent 100%)}
  .lid i{position:absolute;inset:0;background-repeat:no-repeat}
  .lash{opacity:0;transition:opacity .07s}
  .lash i{position:absolute;inset:0;border-bottom:solid rgba(45,28,28,.85);border-radius:0 0 50% 50%/0 0 100% 100%}
  #kit.shut .lid,#kit.blink .lid{clip-path:inset(0 0 0 0)}
  #kit.shut .lash,#kit.blink .lash{opacity:1}
  #mouth{transform-origin:50% 0;opacity:0}
  #mouth i{position:absolute;inset:0;border-radius:42% 42% 50% 50%/30% 30% 70% 70%;
           background:radial-gradient(70% 55% at 50% 90%,#ff8fae 0 45%,transparent 47%),radial-gradient(closest-side,#4a1324 70%,#7a2f42 92%,transparent 100%);
           filter:blur(.4px)}
  #mouth.lick i{animation:lick .35s ease-in-out 3;background:radial-gradient(60% 70% at 50% 75%,#ff8fae 0 60%,transparent 62%),radial-gradient(closest-side,#4a1324 60%,transparent 100%)}
  @keyframes lick{0%,100%{transform:translateY(0) scaleY(.7)}50%{transform:translateY(18%) scaleY(1.1)}}
  #mustache{opacity:0;transition:opacity .4s;background:radial-gradient(50% 50% at 30% 50%,#fffef8 0 55%,transparent 75%),radial-gradient(50% 50% at 70% 50%,#fffef8 0 55%,transparent 75%);filter:blur(.6px)}
  #mustache.on{opacity:.95}
  #splat{opacity:0;transform:scale(.3);transition:opacity .15s,transform .2s cubic-bezier(.3,1.6,.6,1)}
  #splat.on{opacity:1;transform:scale(1)}
  #splat.drip{opacity:0;transform:translateY(25%) scale(1,1.15);transition:opacity .7s,transform .8s ease-in}
  #pie{opacity:0}
  #pie.fly{animation:pieFly .38s cubic-bezier(.5,0,.9,.6) forwards}
  @keyframes pieFly{0%{opacity:1;transform:translate(140%,260%) scale(.5) rotate(40deg)}100%{opacity:1;transform:translate(0,0) scale(1.15) rotate(-6deg)}}
  #milk{opacity:0;transform:translateY(160%) rotate(0);transition:transform .45s cubic-bezier(.3,1.3,.6,1),opacity .2s;transform-origin:50% 80%}
  #milk.up{opacity:1;transform:translateY(0) rotate(-28deg)}
  #cymbals{opacity:0}
  #cymbals.on{opacity:1}
  #cymbals .cL{animation:clapL .55s ease-in-out}#cymbals .cR{animation:clapR .55s ease-in-out}
  @keyframes clapL{0%{transform:translateX(-90%) rotate(-25deg)}40%{transform:translateX(-4%) rotate(0)}100%{transform:translateX(-90%) rotate(-25deg)}}
  @keyframes clapR{0%{transform:translateX(90%) rotate(25deg)}40%{transform:translateX(4%) rotate(0)}100%{transform:translateX(90%) rotate(25deg)}}
  #rays{opacity:0;transform:scale(.4)}
  #rays.on{animation:rays .6s ease-out}
  @keyframes rays{0%{opacity:0;transform:scale(.4)}25%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
  #scratch{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .5s}
  #scratch.on{opacity:1;transition:none}
  #scratch path{stroke-dasharray:140;stroke-dashoffset:140}
  #scratch.on path{animation:claw .18s ease-out forwards}
  #scratch.on path:nth-child(2){animation-delay:.04s}#scratch.on path:nth-child(3){animation-delay:.08s}#scratch.on path:nth-child(4){animation-delay:.12s}
  #scratch.on .g2 path{animation-delay:.55s}#scratch.on .g2 path:nth-child(2){animation-delay:.59s}#scratch.on .g2 path:nth-child(3){animation-delay:.63s}
  @keyframes claw{to{stroke-dashoffset:0}}
  #dizzy{opacity:0;transition:opacity .2s}
  #dizzy.on{opacity:1}
  #dizzy .orb{position:absolute;inset:0;animation:orbit 1s linear infinite;transform-style:preserve-3d}
  #dizzy span{position:absolute;font-size:min(7vw,30px);transform:translate(-50%,-50%)}
  @keyframes orbit{to{transform:rotate(360deg)}}

  @keyframes breathe{0%,100%{transform:scale(1.05)}50%{transform:scale(1.062,1.058)}}
  @keyframes sway{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
  @keyframes bonk{0%,100%{transform:scale(1)}18%{transform:scale(1.05,.9)}40%{transform:scale(.97,1.04)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}
  @keyframes oof{0%,100%{transform:scale(1)}20%{transform:scale(1.07,.9)}45%{transform:scale(.96,1.04)}70%{transform:scale(1.02,.98)}}
  @keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-9%)}55%{transform:translateY(0) scale(1.04,.95)}75%{transform:translateY(-3%)}}
  @keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-4%)}30%{transform:translateX(4%)}45%{transform:translateX(-3%)}60%{transform:translateX(3%)}75%{transform:translateX(-2%)}}
  @keyframes knockL{0%{transform:none}18%{transform:translateX(-14%) rotate(-16deg)}45%{transform:translateX(4%) rotate(5deg)}65%{transform:rotate(-3deg)}85%{transform:rotate(2deg)}100%{transform:none}}
  @keyframes knockR{0%{transform:none}18%{transform:translateX(14%) rotate(16deg)}45%{transform:translateX(-4%) rotate(-5deg)}65%{transform:rotate(3deg)}85%{transform:rotate(-2deg)}100%{transform:none}}
  @keyframes flinch{0%,100%{transform:scale(1)}20%{transform:scale(.94) translateY(3%)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2%) rotate(.6deg)}}
  @keyframes frameShake{0%,100%{transform:none}25%{transform:translate(-6px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-4px,2px)}}
  #rig.sway{animation:sway .55s ease-in-out 4}
  #rig.bonk{animation:bonk .8s ease-out}
  #rig.oof{animation:oof .7s ease-out}
  #rig.hop{animation:hop .75s ease-out}
  #rig.shake{animation:shake .5s ease-in-out 2}
  #rig.knockL{animation:knockL 1.1s ease-out}#rig.knockR{animation:knockR 1.1s ease-out}
  #rig.flinch{animation:flinch .45s ease-out}
  #rig.bob{animation:bob .32s ease-in-out infinite}
  .kitwrap.quake{animation:frameShake .3s linear 2}
  #fx{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:5}
  .pop{position:absolute;font-size:30px;animation:floatUp 1.4s ease-out forwards;transform:translate(-50%,-50%)}
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.1)}
                     100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-260%) scale(.9)}}

  /* ----- buttons ----- */
  .bottom{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:3}
  .acts{display:flex;gap:12px;justify-content:center}
  .act{width:60px;height:60px;border-radius:50%;border:3px solid rgba(255,255,255,.9);background:linear-gradient(#ffe68a,#ffc23f);
       box-shadow:0 5px 0 #c98e12,0 8px 18px rgba(0,0,0,.35);font-size:30px;display:grid;place-items:center;cursor:pointer;padding:0}
  .act:nth-child(2){background:linear-gradient(#ffb3cf,#ff6b9d);box-shadow:0 5px 0 #b8406a,0 8px 18px rgba(0,0,0,.35)}
  .act:nth-child(3){background:linear-gradient(#9fe9ff,#4dd6ff);box-shadow:0 5px 0 #2a8fb3,0 8px 18px rgba(0,0,0,.35)}
  .act:nth-child(4){background:linear-gradient(#c9b8ff,#a78bfa);box-shadow:0 5px 0 #6e55c9,0 8px 18px rgba(0,0,0,.35)}
  .act:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
  .act svg{width:36px;height:36px}
  .mic{display:flex;align-items:center;gap:12px;padding:10px 26px 10px 12px;border:0;border-radius:999px;font:800 21px var(--font);
       background:var(--pink);color:#fff;box-shadow:0 6px 0 #b8406a,0 10px 26px rgba(0,0,0,.4);cursor:pointer}
  .mic:active{transform:translateY(4px);box-shadow:0 2px 0 #b8406a}
  .mic i{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-style:normal;font-size:23px}
  .mic.on{background:var(--green);color:#10331a;box-shadow:0 6px 0 #48a95a,0 10px 26px rgba(0,0,0,.4)}
  .mic.on i{animation:ping 1.2s ease-out infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,255,255,.8)}100%{box-shadow:0 0 0 16px rgba(255,255,255,0)}}
  .tips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:13px;color:var(--soft)}
  .tips span{padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.08)}
  @media (max-height:700px){.tips{display:none}}
  @media (orientation:landscape) and (max-height:560px){
    .app{flex-direction:row;flex-wrap:wrap;align-content:flex-start}
    .top{flex:0 0 100%}
    .stage{flex:1;height:calc(100% - 60px);flex-direction:row}
    .kitwrap{width:calc((var(--vh) - 90px)*.75)}
    .bubble{position:absolute;top:4px;right:0;max-width:30vw}
    .bottom{width:auto;height:calc(100% - 60px);justify-content:center}
    .acts{display:grid;grid-template-columns:1fr 1fr}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="app">
  <div class="top">
    <a class="btn" href="../index.html" aria-label="Home">🏠</a>
    <div class="title">Talking Kitten</div>
    <button class="btn" id="soundBtn" aria-label="Sound on or off">🔊</button>
  </div>

  <div class="stage">
    <div class="bubble" id="bubble">Hi! Pet me! 🐾</div>
    <div class="kitwrap" id="kitwrap">
      <div id="frame" role="img" aria-label="Kitten">
        <div id="rig"><div id="breathe">
          <div id="kit">
            <img class="pose on" data-pose="sit" src="../assets/kitten/kitten-sit.png" alt="" draggable="false">
            <img class="pose" data-pose="tilt" src="../assets/kitten/kitten-tilt.png" alt="" draggable="false">
            <img class="pose" data-pose="face" src="../assets/kitten/kitten-face.png" alt="" draggable="false">
            <div class="ov lid" id="lidL"><i></i></div><div class="ov lid" id="lidR"><i></i></div>
            <div class="ov lash" id="lashL"><i></i></div><div class="ov lash" id="lashR"><i></i></div>
            <div class="ov" id="mouth"><i></i></div>
            <div class="ov" id="mustache"></div>
            <svg class="ov" id="splat" viewBox="0 0 200 200" aria-hidden="true">
              <path d="M100 18c14 0 18 18 30 14s26-8 30 6-8 22 2 32 30 8 28 26-22 14-24 26 16 26 2 36-26-4-36 6-6 26-24 26-18-16-30-14-24 14-34 2 4-24-6-34-30-6-30-24 22-16 20-28-18-22-6-32 26 2 34-8S84 18 100 18z" fill="#fff6e8"/>
              <path d="M70 168c0 14 6 24 10 24s6-10 6-22M126 164c0 18 6 30 11 30s5-14 4-28" fill="#fff6e8"/>
              <ellipse cx="80" cy="80" rx="20" ry="12" fill="#fff" opacity=".9"/>
              <circle cx="132" cy="120" r="7" fill="#e34b6a"/><circle cx="60" cy="126" r="5" fill="#e34b6a"/><circle cx="118" cy="60" r="5" fill="#e34b6a"/>
              <circle cx="100" cy="100" r="9" fill="#e34b6a"/>
            </svg>
            <div class="ov" id="dizzy"><div class="orb"><span style="left:50%;top:0">💫</span><span style="left:100%;top:50%">⭐</span><span style="left:50%;top:100%">💫</span><span style="left:0;top:50%">⭐</span></div></div>
          </div>
        </div></div>
        <!-- props live outside the rig so they don't wobble with the kitten -->
        <svg class="ov" id="pie" viewBox="0 0 120 80" aria-hidden="true">
          <ellipse cx="60" cy="52" rx="56" ry="22" fill="#c98a3c"/><ellipse cx="60" cy="44" rx="56" ry="22" fill="#e7b86a"/>
          <path d="M8 40c6-26 98-26 104 0-10 12-94 12-104 0z" fill="#fff6e8"/><circle cx="60" cy="24" r="8" fill="#e34b6a"/>
        </svg>
        <svg class="ov" id="milk" viewBox="0 0 60 90" aria-hidden="true">
          <path d="M6 6h48l-6 80H12z" fill="rgba(255,255,255,.35)" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
          <path d="M9 26h42l-4.6 57H13.6z" fill="#fffef8"/><path d="M12 12v60" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/>
        </svg>
        <div class="ov" id="cymbals">
          <svg class="cL" viewBox="0 0 100 100" style="position:absolute;left:0;top:0;width:50%;height:100%" aria-hidden="true">
            <ellipse cx="60" cy="50" rx="14" ry="46" fill="#d9a520" stroke="#8a6410" stroke-width="3"/><ellipse cx="62" cy="50" rx="5" ry="10" fill="#8a6410"/><path d="M58 20q6 30 0 60" stroke="#fff3b0" stroke-width="3" fill="none"/></svg>
          <svg class="cR" viewBox="0 0 100 100" style="position:absolute;right:0;top:0;width:50%;height:100%" aria-hidden="true">
            <ellipse cx="40" cy="50" rx="14" ry="46" fill="#d9a520" stroke="#8a6410" stroke-width="3"/><ellipse cx="38" cy="50" rx="5" ry="10" fill="#8a6410"/><path d="M42 20q-6 30 0 60" stroke="#fff3b0" stroke-width="3" fill="none"/></svg>
        </div>
        <svg class="ov" id="rays" viewBox="0 0 100 100" aria-hidden="true">
          <g stroke="#ffd23f" stroke-width="5" stroke-linecap="round"><path d="M50 4v16M50 80v16M4 50h16M80 50h16M17 17l11 11M72 72l11 11M83 17L72 28M17 83l11-11"/></g></svg>
        <svg id="scratch" viewBox="0 0 100 133" preserveAspectRatio="none" aria-hidden="true">
          <g fill="none" stroke-linecap="round">
            <g stroke="rgba(255,255,255,.95)" stroke-width="2.2"><path d="M18 12 L58 70"/><path d="M27 8 L67 66"/><path d="M36 5 L76 62"/><path d="M45 3 L84 58"/></g>
            <g class="g2" stroke="rgba(255,255,255,.95)" stroke-width="2.2"><path d="M20 78 L62 126"/><path d="M30 74 L72 122"/><path d="M40 71 L80 116"/></g>
          </g>
        </svg>
      </div>
      <div id="fx"></div>
    </div>
  </div>

  <div class="bottom">
    <div class="acts">
      <button class="act" id="bMilk" aria-label="Give milk" title="Milk">🥛</button>
      <button class="act" id="bPie" aria-label="Throw a pie" title="Pie">🥧</button>
      <button class="act" id="bCym" aria-label="Crash the cymbals" title="Cymbals">
        <svg viewBox="0 0 40 40"><ellipse cx="12" cy="20" rx="6" ry="16" fill="#d9a520" stroke="#6b4d0c" stroke-width="2"/><ellipse cx="28" cy="20" rx="6" ry="16" fill="#d9a520" stroke="#6b4d0c" stroke-width="2"/></svg>
      </button>
      <button class="act" id="bScratch" aria-label="Scratch the screen" title="Scratch">🐾</button>
    </div>
    <button class="mic" id="micBtn"><i>🎤</i><span id="micText">Talk to me</span></button>
    <div class="tips"><span>Talk, I copy you</span><span>Stroke me</span><span>Poke my head</span><span>Swipe my face</span><span>Tap my toes</span><span>Not my tail!</span></div>
  </div>
</div>

<script>
/* ================= sound engine (all made in code) ================= */
let AC=null,OUT=null,soundOn=true,noiseBuf=null;
try{soundOn=localStorage.getItem('sk-kitten-sound')!=='off';}catch(_){}
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();OUT=AC.createGain();OUT.gain.value=.9;OUT.connect(AC.destination);}
  if(AC.state==='suspended')AC.resume();return AC;}
function noise(){if(noiseBuf)return noiseBuf;const c=ac(),len=c.sampleRate*2;noiseBuf=c.createBuffer(1,len,c.sampleRate);const d=noiseBuf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;return noiseBuf;}
function env(g,t,a,peak,hold,rel){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.setValueAtTime(peak,t+a+hold);g.gain.linearRampToValueAtTime(0,t+a+hold+rel);}
function snd(){const c=ac();return c&&soundOn?c:null;}
// a burst of filtered noise
function hiss(c,t,type,freq,q,a,peak,hold,rel,sweepTo){const s=c.createBufferSource();s.buffer=noise();s.loop=true;const f=c.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(freq,t);f.Q.value=q;
  if(sweepTo)f.frequency.linearRampToValueAtTime(sweepTo,t+a+hold+rel);const g=c.createGain();env(g,t,a,peak,hold,rel);s.connect(f);f.connect(g);g.connect(OUT);s.start(t,Math.random());s.stop(t+a+hold+rel+.05);}
// a cat "mew" shaped by a moving formant
function mew(c,t,f0,f1,f2,dur,vol){const o=c.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f1,t+dur*.25);o.frequency.linearRampToValueAtTime(f2,t+dur);
  const vib=c.createOscillator(),vg=c.createGain();vib.frequency.value=7;vg.gain.value=f1*.015;vib.connect(vg);vg.connect(o.frequency);
  const f=c.createBiquadFilter();f.type='bandpass';f.Q.value=3;f.frequency.setValueAtTime(1000,t);f.frequency.linearRampToValueAtTime(2300,t+dur*.28);f.frequency.linearRampToValueAtTime(900,t+dur);
  const g=c.createGain();env(g,t,.04,vol,dur*.45,dur*.5);o.connect(f);f.connect(g);g.connect(OUT);o.start(t);vib.start(t);o.stop(t+dur+.1);vib.stop(t+dur+.1);}

function purrSound(){const c=snd();if(!c)return;const t=c.currentTime,dur=1.9;
  const src=c.createBufferSource();src.buffer=noise();src.loop=true;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=280;
  const am=c.createGain();am.gain.value=.5;const lfo=c.createOscillator();lfo.frequency.value=25;const lg=c.createGain();lg.gain.value=.5;lfo.connect(lg);lg.connect(am.gain);

/* ================= talk-back: listens hands-free, repeats in YOUR voice, squeaky =================
   One tap on the mic turns it on. The kitten tilts its head while it listens, records while you talk,
   and when you stop it plays your own voice back faster and higher, moving its mouth.
   Works offline in every modern browser (no speech-to-text service needed). */
const micBtn=$('micBtn'),micText=$('micText');
const TB={on:false,stream:null,src:null,proc:null,mute:null,state:'idle', // idle | hearing | talking
  noise:.006,pre:[],rec:[],recLen:0,lastLoud:0,started:0,ignoreUntil:0,player:null};
const PITCH=1.55,      // how squeaky (1 = your normal voice)
      START_LVL=3.2,   // how much louder than the room you need to be
      SILENCE_MS=750,  // pause that ends a sentence
      MAX_MS=9000,     // longest recording
      MIN_MS=280,      // ignore tiny clicks
      PRE_BLOCKS=6;    // keep the start of the first word
let talking=false;
function setMic(on){micBtn.classList.toggle('on',on);micText.textContent=on?'Listening…':'Talk to me';if(performance.now()>busyUntil)setPose(basePose());}
function rms(buf){let s=0;for(let i=0;i<buf.length;i+=2)s+=buf[i]*buf[i];return Math.sqrt(s/(buf.length/2));}

async function startTalkBack(){
  const c=ac();if(!c){say('Sorry, this browser has no sound 😿',3000);return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){say('Open me from a web address to talk 🎤',3500);return;}
  try{TB.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});}
  catch(e){say('Please let me use the microphone 🎤',3500);return;}
  TB.src=c.createMediaStreamSource(TB.stream);
  TB.proc=c.createScriptProcessor(2048,1,1);TB.mute=c.createGain();TB.mute.gain.value=0;
  TB.src.connect(TB.proc);TB.proc.connect(TB.mute);TB.mute.connect(c.destination);
  TB.proc.onaudioprocess=onBlock;TB.on=true;TB.state='idle';TB.noise=.006;setMic(true);say("Say something! I'll copy you 👂",2600);
}
function stopTalkBack(){
  TB.on=false;TB.state='idle';
  try{TB.proc&&TB.proc.disconnect();TB.src&&TB.src.disconnect();TB.mute&&TB.mute.disconnect();}catch(_){}
  if(TB.stream)TB.stream.getTracks().forEach(t=>t.stop());TB.stream=null;
  if(TB.player)try{TB.player.stop();}catch(_){}
  talking=false;rigDo(null);setMouth(0);setMic(false);
}
function onBlock(e){
  if(!TB.on||TB.state==='talking')return;
  const inp=e.inputBuffer.getChannelData(0),blk=new Float32Array(inp),lvl=rms(blk),now=performance.now();
  if(now<TB.ignoreUntil){TB.pre=[];return;} // don't copy the kitten's own purrs and meows
  if(TB.state==='idle'){
    TB.noise=TB.noise*.97+Math.min(lvl,.05)*.03;            // learn the room's background sound
    TB.pre.push(blk);if(TB.pre.length>PRE_BLOCKS)TB.pre.shift();
    if(lvl>Math.max(.012,TB.noise*START_LVL)){                // someone is talking
      TB.state='hearing';TB.rec=TB.pre.slice();TB.recLen=TB.rec.reduce((n,b)=>n+b.length,0);TB.pre=[];
      TB.started=TB.lastLoud=now;say('👂 …',0);}
    return;}
  // hearing
  TB.rec.push(blk);TB.recLen+=blk.length;
  if(lvl>Math.max(.009,TB.noise*2.2))TB.lastLoud=now;
  if(now-TB.lastLoud>SILENCE_MS||now-TB.started>MAX_MS){
    const spoke=TB.lastLoud-TB.started;
    if(spoke<MIN_MS){TB.state='idle';TB.rec=[];bubble.classList.remove('show');return;}
    playBack();}
}
function playBack(){
  const c=AC;TB.state='talking';talking=true;reset();setPose('sit');
  // join the recording, trim the silent tail, fade the edges
  const sr=c.sampleRate,tail=Math.floor(sr*SILENCE_MS/1000*.8),len=Math.max(1,TB.recLen-tail),buf=c.createBuffer(1,len,sr),d=buf.getChannelData(0);
  let o=0;for(const b of TB.rec){const n=Math.min(b.length,len-o);if(n<=0)break;d.set(b.subarray(0,n),o);o+=n;}
  let peak=0;for(let i=0;i<len;i++)peak=Math.max(peak,Math.abs(d[i]));const gn=peak>0?Math.min(6,.85/peak):1;
  const f=Math.floor(sr*.01);for(let i=0;i<len;i++){let k=gn;if(i<f)k*=i/f;else if(i>len-f)k*=(len-i)/f;d[i]*=k;}
  TB.rec=[];TB.recLen=0;
  if(!soundOn){finishTalk();return;}
  const s=c.createBufferSource();s.buffer=buf;s.playbackRate.value=PITCH;   // faster + higher = squeaky kitten
  const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=180;
  const an=c.createAnalyser();an.fftSize=512;const vol=c.createGain();vol.gain.value=1.1;
  s.connect(hp);hp.connect(an);an.connect(vol);vol.connect(OUT);TB.player=s;
  say(['🎶','😸','💬'][Math.floor(Math.random()*3)],0);rigDo('bob');
  const data=new Uint8Array(an.fftSize);let raf,sm=0;
  const flap=()=>{an.getByteTimeDomainData(data);let m=0;for(let i=0;i<data.length;i+=4)m=Math.max(m,Math.abs(data[i]-128));
    sm=sm*.5+Math.min(1,Math.max(0,(m-6)/45))*.5;setMouth(sm);raf=requestAnimationFrame(flap);};   // mouth follows your voice
  flap();s.onended=()=>{cancelAnimationFrame(raf);finishTalk();};s.start();
}
function finishTalk(){
  talking=false;TB.player=null;setMouth(0);rigDo(null);say.t=setTimeout(()=>bubble.classList.remove('show'),600);
  TB.ignoreUntil=performance.now()+450;TB.pre=[];TB.state='idle';setPose(basePose());
}

micBtn.addEventListener('click',()=>{if(TB.on){stopTalkBack();say('Bye bye! 👋',1500);}else startTalkBack();});

/* ================= sound toggle ================= */
const soundBtn=$('soundBtn');const paint=()=>soundBtn.textContent=soundOn?'🔊':'🔇';paint();
soundBtn.onclick=()=>{soundOn=!soundOn;paint();try{localStorage.setItem('sk-kitten-sound',soundOn?'on':'off');}catch(_){}};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&TB.on)stopTalkBack();});
setTimeout(()=>say('Hi! Pet me! 🐾',2600),400);

/* ================= stars ================= */
(function(){const c=$('sky'),x=c.getContext('2d');let W,H,st=[],sh=null,next=performance.now()+6000,last=0;
  function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
    st=Array.from({length:Math.round(W*H/3000)},()=>({x:Math.random()*W,y:Math.random()*H*.8,r:Math.random()*1.2+.3,a:Math.random()*.6+.3,s:Math.random()<.2?Math.random()+.4:0,p:Math.random()*6}));}
  function f(t){requestAnimationFrame(f);if(document.hidden||t-last<45)return;last=t;x.clearRect(0,0,W,H);
    for(const s of st){x.globalAlpha=s.s?s.a*(.6+.4*Math.sin(t/1000*s.s+s.p)):s.a;x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill();}
    x.globalAlpha=1;if(!sh&&t>next)sh={x:Math.random()*W*.6+W*.3,y:Math.random()*H*.25,life:1};
    if(sh){sh.x-=14;sh.y+=6;sh.life-=.025;const g=x.createLinearGradient(sh.x,sh.y,sh.x+100,sh.y-42);g.addColorStop(0,'rgba(255,255,255,'+Math.max(0,sh.life)+')');g.addColorStop(1,'rgba(255,255,255,0)');
      x.strokeStyle=g;x.lineWidth=2;x.beginPath();x.moveTo(sh.x,sh.y);x.lineTo(sh.x+100,sh.y-42);x.stroke();if(sh.life<=0){sh=null;next=t+8000+Math.random()*8000;}}}
  addEventListener('resize',size);size();requestAnimationFrame(f);})();

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{}));
</script>
