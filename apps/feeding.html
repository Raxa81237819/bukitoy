<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Feed the Animals - Star Kids</title>
<meta name="theme-color" content="#0b1030">
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" href="../assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b1030;--ink:#fff;--soft:#c9cdf5;--yellow:#ffd23f;--pink:#ff6b9d;--green:#7ae582;--teal:#2ee6c5;
        --font:"Baloo 2","Chalkboard SE","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;--vh:100vh;
        --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
  @supports (height:100dvh){:root{--vh:100dvh}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior:none;touch-action:none}
  body{background:radial-gradient(120% 70% at 50% 0%,#1f4a7a 0%,var(--bg) 62%)}
  #sky,#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  #confetti{z-index:9}
  .app{position:relative;height:var(--vh);display:grid;grid-template-rows:auto auto 1fr auto auto;gap:8px;
       padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .btn{width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(20,24,70,.78);color:#fff;
       font-size:22px;display:grid;place-items:center;text-decoration:none;cursor:pointer}
  .btn:active{transform:scale(.92)}
  .score{font-weight:800;font-size:20px;padding:6px 16px;border-radius:999px;background:rgba(20,24,70,.85);border:2px solid rgba(255,255,255,.18)}
  .say{text-align:center;font-weight:800;font-size:clamp(18px,5vw,24px);color:var(--soft);min-height:1.4em}
  .animals{display:flex;justify-content:center;align-items:center;gap:clamp(8px,3vw,24px)}
  .animal{position:relative;flex:1;max-width:220px;display:flex;flex-direction:column;align-items:center;padding-top:10px}
  .face{position:relative;font-family:var(--emoji);font-size:var(--a);line-height:1;z-index:2;transition:transform .2s;filter:drop-shadow(0 8px 6px rgba(0,0,0,.35))}
  .rock{width:100%;max-width:170px;aspect-ratio:3/1;margin-top:calc(var(--a)*-.18);border-radius:50%;
        background:var(--p);background:radial-gradient(60% 70% at 50% 30%,var(--p),color-mix(in srgb,var(--p) 50%,#0b1030));box-shadow:inset 0 6px 0 rgba(255,255,255,.18),0 10px 20px rgba(0,0,0,.4)}
  .label{margin-top:6px;font-weight:800;font-size:clamp(15px,4vw,19px);text-transform:capitalize}
  .bub{position:absolute;top:-6px;left:50%;transform:translate(-50%,-90%) scale(.3);padding:6px 14px;border-radius:18px;background:#fff;color:#2b2140;
       font-weight:800;font-size:clamp(15px,4vw,20px);white-space:nowrap;opacity:0;transition:.25s cubic-bezier(.3,1.6,.6,1);z-index:4;pointer-events:none}
  .bub.show{opacity:1;transform:translate(-50%,-100%) scale(1)}
  .bub.bad{background:#ffd1dc}
  .animal.hover .face{transform:scale(1.15)}
  .animal.hover .rock{box-shadow:0 0 0 4px var(--yellow),0 10px 20px rgba(0,0,0,.4)}
  .animal.eat .face{animation:chew .3s ease-in-out 4}
  .animal.no .face{animation:nope .45s ease-in-out 2}
  .animal.full .face::after{content:"✓";position:absolute;right:-6px;bottom:-4px;width:32px;height:32px;border-radius:50%;background:var(--green);color:#10331a;
       font:800 22px var(--font);display:grid;place-items:center;border:3px solid #fff}
  @keyframes chew{0%,100%{transform:scale(1)}50%{transform:scale(1.12,.9)}}
  @keyframes nope{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
  .tray{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:clamp(8px,2.5vw,18px);padding:12px;border-radius:28px;
        background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);min-height:calc(var(--f) + 30px)}
  .food{width:calc(var(--f) * 1.25);height:calc(var(--f) * 1.25);display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.12);
        font-family:var(--emoji);font-size:var(--f);line-height:1;cursor:grab;touch-action:none;z-index:3;transition:transform .2s}
  .food.drag{cursor:grabbing;transition:none;z-index:20;transform:scale(1.2);background:transparent}
  .food.ghost{visibility:hidden}
  .food.gone{transition:all .45s ease-in;transform:scale(0) !important;opacity:0}
  .hearts{position:fixed;pointer-events:none;font-size:30px;font-family:var(--emoji);animation:up 1.3s ease-out forwards;z-index:8;transform:translate(-50%,-50%)}
  @keyframes up{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-280%) scale(1)}}
  .hint{text-align:center;color:var(--soft);font-size:14px}
  @media (orientation:landscape) and (max-height:560px){.app{grid-template-rows:auto 1fr auto;grid-template-columns:2fr 1fr}
    .top{grid-column:1/-1}.say{display:none}.animals{grid-row:2;grid-column:1}.tray{grid-row:2;grid-column:2;align-content:center}.hint{display:none}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="app">
  <div class="top">
    <a class="btn" href="../index.html" aria-label="Home">🏠</a>
    <div class="score" id="score">🍽️ 0</div>
    <button class="btn" id="soundBtn" aria-label="Sound on or off">🔊</button>
  </div>
  <div class="say" id="say">Who is hungry? Feed them!</div>
  <div class="animals" id="animals"></div>
  <div class="tray" id="tray"></div>
  <div class="hint">Drag the food to the animal who likes it</div>
</div>
<canvas id="confetti"></canvas>

<script>
const ANIMALS=[
  {id:'monkey',a:'🐵',food:'banana',f:'🍌',p:'#ffb35c'},{id:'rabbit',a:'🐰',food:'carrot',f:'🥕',p:'#ff8fb0'},
  {id:'dog',a:'🐶',food:'bone',f:'🦴',p:'#4dd6ff'},{id:'cat',a:'🐱',food:'fish',f:'🐟',p:'#a78bfa'},
  {id:'panda',a:'🐼',food:'bamboo',f:'🎋',p:'#7ae582'},{id:'mouse',a:'🐭',food:'cheese',f:'🧀',p:'#ffd23f'},
  {id:'bear',a:'🐻',food:'honey',f:'🍯',p:'#ff9f43'},{id:'chick',a:'🐥',food:'corn',f:'🌽',p:'#2ee6c5'},
  {id:'horse',a:'🐴',food:'apple',f:'🍎',p:'#ff6b6b'},{id:'koala',a:'🐨',food:'leaves',f:'🌿',p:'#9ad1ff'}
];
const animalsEl=document.getElementById('animals'),tray=document.getElementById('tray'),sayEl=document.getElementById('say');
let fed=0,need=3,total=0;try{total=+localStorage.getItem('sk-feed-total')||0;}catch(_){}
document.getElementById('score').textContent='🍽️ '+total;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function sizes(){const w=innerWidth,h=innerHeight,land=w>h&&h<560;const a=Math.round(Math.max(54,Math.min(110,(land?w*.66:w)/5.2,h*(land?.22:.13))));
  const f=Math.round(Math.max(38,Math.min(70,(land?w*.3:w)/(land?4.2:7.4),h*(land?.13:.075))));
  document.documentElement.style.setProperty('--a',a+'px');document.documentElement.style.setProperty('--f',f+'px');}
function newRound(){
  fed=0;const pick=shuffle(ANIMALS.slice()),here=pick.slice(0,need),extra=pick.slice(need,need+2);
  animalsEl.innerHTML=here.map(a=>`<div class="animal" data-id="${a.id}" style="--p:${a.p}"><div class="bub"></div><div class="face">${a.a}</div><div class="rock"></div><div class="label">${a.id}</div></div>`).join('');
  tray.innerHTML=shuffle([...here,...extra]).map(a=>`<div class="food" data-food="${a.id}" aria-label="${a.food}">${a.f}</div>`).join('');
  sayEl.textContent='Who is hungry? Feed them!';}

/* ================= drag and drop ================= */
let drag=null;
tray.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.food');if(!el||drag)return;audio();e.preventDefault();const r=el.getBoundingClientRect();
  const ghost=el.cloneNode(true);ghost.classList.add('ghost');el.parentNode.insertBefore(ghost,el);
  drag={el,ghost,id:e.pointerId,ox:e.clientX-r.left,oy:e.clientY-r.top};
  el.classList.add('drag');el.style.position='fixed';el.style.left=r.left+'px';el.style.top=r.top+'px';el.style.margin='0';
  try{el.setPointerCapture(e.pointerId);}catch(_){}pick();
});
addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;drag.el.style.left=(e.clientX-drag.ox)+'px';drag.el.style.top=(e.clientY-drag.oy)+'px';
  const t=target(e);animalsEl.querySelectorAll('.animal').forEach(a=>a.classList.toggle('hover',a===t));});
function target(e){let hit=null;animalsEl.querySelectorAll('.animal:not(.full)').forEach(a=>{const r=a.getBoundingClientRect();
  if(e.clientX>r.left-10&&e.clientX<r.right+10&&e.clientY>r.top-20&&e.clientY<r.bottom+20)hit=a;});return hit;}
function drop(e){
  if(!drag||e.pointerId!==drag.id)return;const{el,ghost}=drag;drag=null;const a=target(e);animalsEl.querySelectorAll('.animal').forEach(x=>x.classList.remove('hover'));
  el.classList.remove('drag');
  if(a){const info=ANIMALS.find(x=>x.id===a.dataset.id),food=ANIMALS.find(x=>x.id===el.dataset.food);
    if(food.id===info.id){ // yum!
      const fr=a.querySelector('.face').getBoundingClientRect();el.style.transition='all .4s ease-in';
      el.style.left=(fr.left+fr.width/2-el.offsetWidth/2)+'px';el.style.top=(fr.top+fr.height*.55-el.offsetHeight/2)+'px';el.classList.add('gone');
      setTimeout(()=>{el.remove();ghost.remove();},450);
      a.classList.add('eat','full');bubble(a,['Yum! 😋','Yummy!','Mmm! 💕','Num num!'][Math.floor(Math.random()*4)]);munch();
      hearts(fr.left+fr.width/2,fr.top+fr.height/3,['💖','✨','💕','⭐'],5);setTimeout(()=>a.classList.remove('eat'),1300);
      say(`Yum! The ${info.id} loves the ${info.food}!`);sayEl.textContent=`The ${info.id} loves ${info.food}! 💖`;
      total++;try{localStorage.setItem('sk-feed-total',total);}catch(_){}document.getElementById('score').textContent='🍽️ '+total;
      if(++fed===need)setTimeout(roundDone,1300);return;}
    a.classList.remove('no');void a.offsetWidth;a.classList.add('no');setTimeout(()=>a.classList.remove('no'),950);
    bubble(a,['Yuck! 🤢','No thanks!','Blah! 😝'][Math.floor(Math.random()*3)],true);bleh();
    say(`No thanks! The ${info.id} wants ${info.food}.`);sayEl.textContent=`The ${info.id} wants ${info.f}`;}
  // fly back to the tray
  const r=ghost.getBoundingClientRect();el.style.transition='left .35s cubic-bezier(.3,1.4,.6,1), top .35s cubic-bezier(.3,1.4,.6,1)';
  el.style.left=r.left+'px';el.style.top=r.top+'px';
  setTimeout(()=>{el.style.cssText='';ghost.replaceWith(el);},370);
}
addEventListener('pointerup',drop);addEventListener('pointercancel',drop);
function bubble(a,text,bad){const b=a.querySelector('.bub');b.textContent=text;b.classList.toggle('bad',!!bad);b.classList.add('show');clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('show'),1500);}
function hearts(x,y,list,n){for(let i=0;i<n;i++){const h=document.createElement('div');h.className='hearts';h.textContent=list[i%list.length];
  h.style.left=(x+Math.random()*50-25)+'px';h.style.top=y+'px';h.style.setProperty('--dx',(Math.random()*100-50)+'px');h.style.animationDelay=(i*.1)+'s';
  document.body.appendChild(h);setTimeout(()=>h.remove(),1400+i*100);}}
function roundDone(){sayEl.textContent='🎉 Everyone is full! 🎉';say('Hooray! Everyone is full!');fanfare();
  for(let i=0;i<5;i++)setTimeout(()=>confetti(Math.random()*innerWidth,innerHeight*.35*Math.random(),55),i*220);setTimeout(newRound,3400);}

/* ================= confetti ================= */
const cf=document.getElementById('confetti'),cx=cf.getContext('2d');let bits=[],running=false,CW=0,CH=0;
function cfSize(){const d=Math.min(devicePixelRatio||1,2);CW=innerWidth;CH=innerHeight;cf.width=CW*d;cf.height=CH*d;cx.setTransform(d,0,0,d,0,0);}cfSize();
const CC=['#ff6b9d','#ffd23f','#4dd6ff','#7ae582','#a78bfa','#ff9f43','#fff'];
function confetti(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=180+Math.random()*420;bits.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-220,r:Math.random()*6,vr:Math.random()*10-5,
  w:6+Math.random()*7,h:4+Math.random()*5,c:CC[i%CC.length],star:Math.random()<.3,life:1.8+Math.random()});}
  if(running)return;running=true;let last=performance.now();const f=t=>{const dt=Math.min(.04,(t-last)/1000);last=t;cx.clearRect(0,0,CW,CH);
    for(let i=bits.length-1;i>=0;i--){const b=bits[i];b.life-=dt;if(b.life<=0||b.y>CH+40){bits.splice(i,1);continue;}b.vy+=600*dt;b.vx*=.985;b.x+=b.vx*dt;b.y+=b.vy*dt;b.r+=b.vr*dt;
      cx.save();cx.globalAlpha=Math.min(1,b.life);cx.translate(b.x,b.y);cx.rotate(b.r);cx.fillStyle=b.c;
      if(b.star){cx.beginPath();for(let k=0;k<10;k++){const q=k*Math.PI/5,rr=k%2?b.w*.45:b.w;cx.lineTo(Math.cos(q)*rr,Math.sin(q)*rr);}cx.fill();}else cx.fillRect(-b.w/2,-b.h/2,b.w,b.h);cx.restore();}
    if(bits.length)requestAnimationFrame(f);else{running=false;cx.clearRect(0,0,CW,CH);}};requestAnimationFrame(f);}

/* ================= sounds ================= */
let AC=null,soundOn=true,NB=null;try{soundOn=localStorage.getItem('sk-feed-sound')!=='off';}catch(_){}
function audio(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function nb(){if(NB)return NB;const len=AC.sampleRate;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;return NB;}
function note(f,t,d,v,type,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05);}
function pick(){if(!audio()||!soundOn)return;note(500,AC.currentTime,.12,.12,'triangle',800);}
function munch(){if(!audio()||!soundOn)return;const t=AC.currentTime;for(let i=0;i<4;i++){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nb();f.type='lowpass';f.frequency.value=1100;g.gain.setValueAtTime(0,t+i*.22);g.gain.linearRampToValueAtTime(.6,t+i*.22+.01);g.gain.exponentialRampToValueAtTime(.001,t+i*.22+.12);
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t+i*.22,Math.random()*.5);s.stop(t+i*.22+.15);note(140,t+i*.22,.1,.25,'sine',80);}
  [784,988,1175].forEach((f,i)=>note(f,t+.95+i*.08,.35,.15));}
function bleh(){if(!audio()||!soundOn)return;const t=AC.currentTime;const o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(320,t);o.frequency.exponentialRampToValueAtTime(140,t+.5);l.frequency.value=16;lg.gain.value=30;l.connect(lg);lg.connect(o.frequency);
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.55);
  o.connect(f);f.connect(g);g.connect(AC.destination);o.start(t);l.start(t);o.stop(t+.6);l.stop(t+.6);}
function fanfare(){if(!audio()||!soundOn)return;const t=AC.currentTime;[[523,0],[659,.15],[784,.3],[1047,.45],[784,.65],[1047,.8]].forEach(([f,d])=>{note(f,t+d,.45,.2,'triangle');note(f/2,t+d,.4,.1);});}
let voiceCache=null;
function voice(){if(voiceCache)return voiceCache;const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];const en=vs.filter(v=>/^en/i.test(v.lang));
  for(const p of['Google UK English Female','Samantha','Microsoft Ava','Microsoft Jenny','Microsoft Aria','Karen','Tessa','Moira','Zira','Google US English']){const v=en.find(v=>v.name.includes(p));if(v)return voiceCache=v;}
  return voiceCache=en.find(v=>/female/i.test(v.name))||en[0]||null;}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{voiceCache=null;};
function say(text){if(!soundOn||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=voice();if(v){u.voice=v;u.lang=v.lang;}
  u.pitch=1.25;u.rate=.95;setTimeout(()=>speechSynthesis.speak(u),350);}
const soundBtn=document.getElementById('soundBtn');const paint=()=>soundBtn.textContent=soundOn?'🔊':'🔇';paint();
soundBtn.onclick=()=>{soundOn=!soundOn;paint();try{localStorage.setItem('sk-feed-sound',soundOn?'on':'off');}catch(_){}};

/* stars */
(function(){const c=document.getElementById('sky'),x=c.getContext('2d');let W,H,st=[],last=0;
  function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
    st=Array.from({length:Math.round(W*H/3400)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.3,a:Math.random()*.5+.25,s:Math.random()<.2?Math.random()+.4:0,p:Math.random()*6}));}
  function f(t){requestAnimationFrame(f);if(document.hidden||t-last<70)return;last=t;x.clearRect(0,0,W,H);
    for(const s of st){x.globalAlpha=s.s?s.a*(.6+.4*Math.sin(t/1000*s.s+s.p)):s.a;x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill();}}
  addEventListener('resize',size);size();requestAnimationFrame(f);})();

addEventListener('resize',()=>{sizes();cfSize();});sizes();newRound();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{}));
</script>
</body>
</html>
