<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Shape Match - Star Kids</title>
<meta name="theme-color" content="#0b1030">
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" href="../assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b1030;--ink:#fff;--soft:#c9cdf5;--yellow:#ffd23f;--pink:#ff6b9d;--green:#7ae582;
        --font:"Baloo 2","Chalkboard SE","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;--vh:100vh}
  @supports (height:100dvh){:root{--vh:100dvh}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior:none;touch-action:none}
  body{background:radial-gradient(120% 70% at 50% 0%,#2a2f86 0%,var(--bg) 62%)}
  #sky,#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  #confetti{z-index:6}
  .app{position:relative;height:var(--vh);display:grid;grid-template-rows:auto 1fr auto 1fr;
       padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px);gap:6px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:3}
  .btn{width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(20,24,70,.78);color:#fff;
       font-size:22px;display:grid;place-items:center;text-decoration:none;cursor:pointer}
  .btn:active{transform:scale(.92)}
  .stars{font-size:22px;letter-spacing:2px;min-width:60px;text-align:center}
  .zone{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;gap:var(--gap,18px)}
  .holes{background:rgba(255,255,255,.06);border:3px dashed rgba(255,255,255,.18);border-radius:30px;padding:10px}
  .say{text-align:center;font-weight:800;font-size:clamp(18px,5vw,24px);color:var(--soft);min-height:1.4em}
  .slot,.piece{width:var(--s);height:var(--s);position:relative}
  .slot svg,.piece svg{width:100%;height:100%;display:block;overflow:visible}
  .slot path,.slot circle,.slot rect,.slot ellipse,.slot polygon{fill:rgba(0,0,0,.35);stroke:rgba(255,255,255,.65);stroke-width:5;stroke-dasharray:10 8;stroke-linejoin:round}
  .slot.filled svg *{fill:var(--c);stroke:#fff;stroke-dasharray:none}
  .slot.filled{animation:boing .5s cubic-bezier(.3,1.8,.5,1)}
  .slot.hover svg *{stroke:var(--yellow);stroke-width:7}
  .piece{cursor:grab;touch-action:none;transition:transform .25s cubic-bezier(.3,1.6,.6,1);z-index:2}
  .piece svg *{fill:var(--c);stroke:#fff;stroke-width:5;stroke-linejoin:round;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
  .piece .eye{fill:#2b2140;stroke:none;filter:none}.piece .shine{fill:#fff;stroke:none;filter:none}
  .piece .mouth{fill:none;stroke:#2b2140;stroke-width:4;stroke-linecap:round;filter:none}
  .piece.drag{cursor:grabbing;transition:none;z-index:10}
  .piece.drag svg{transform:scale(1.12)}
  .piece.home{visibility:hidden}
  .piece.wiggle{animation:wiggle .45s ease-in-out}
  @keyframes boing{0%{transform:scale(.6)}100%{transform:scale(1)}}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
  @media (orientation:landscape) and (max-height:560px){
    .app{grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr}
    .top{grid-column:1/-1}.say{grid-column:1/-1;order:-1}
  }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="app">
  <div class="top">
    <a class="btn" href="../index.html" aria-label="Home">🏠</a>
    <div class="stars" id="stars">⭐ 0</div>
    <button class="btn" id="soundBtn" aria-label="Sound on or off">🔊</button>
  </div>
  <div class="zone holes" id="holes"></div>
  <div class="say" id="say">Drag each shape to its home!</div>
  <div class="zone" id="tray"></div>
</div>
<canvas id="confetti"></canvas>

<script>
/* ================= shapes (100 x 100 box) ================= */
function starPath(){let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?21:48;d+=(i?'L':'M')+(50+r*Math.cos(a)).toFixed(1)+' '+(54+r*Math.sin(a)).toFixed(1);}return d+'Z';}
function hexPath(){let d='';for(let i=0;i<6;i++){const a=i*Math.PI/3,r=46;d+=(i?'L':'M')+(50+r*Math.cos(a)).toFixed(1)+' '+(50+r*Math.sin(a)).toFixed(1);}return d+'Z';}
const SHAPES=[
  {id:'circle',name:'circle',c:'#ff6b9d',svg:'<circle cx="50" cy="50" r="44"/>',face:[50,48]},
  {id:'square',name:'square',c:'#4dd6ff',svg:'<rect x="8" y="8" width="84" height="84" rx="10"/>',face:[50,48]},
  {id:'triangle',name:'triangle',c:'#ffd23f',svg:'<path d="M50 6 L95 90 L5 90 Z"/>',face:[50,62]},
  {id:'star',name:'star',c:'#ff9f43',svg:`<path d="${starPath()}"/>`,face:[50,56]},
  {id:'heart',name:'heart',c:'#ff4d6d',svg:'<path d="M50 90 C 10 62, 4 36, 22 20 C 36 8, 50 18, 50 30 C 50 18, 64 8, 78 20 C 96 36, 90 62, 50 90 Z"/>',face:[50,46]},
  {id:'diamond',name:'diamond',c:'#a78bfa',svg:'<path d="M50 4 L92 50 L50 96 L8 50 Z"/>',face:[50,50]},
  {id:'oval',name:'oval',c:'#7ae582',svg:'<ellipse cx="50" cy="50" rx="46" ry="32"/>',face:[50,48]},
  {id:'hexagon',name:'hexagon',c:'#2ee6c5',svg:`<path d="${hexPath()}"/>`,face:[50,48]},
  {id:'moon',name:'moon',c:'#fff1a8',svg:'<path d="M62 6 A 44 44 0 1 0 94 70 A 36 36 0 1 1 62 6 Z"/>',face:[34,52]},
  {id:'rectangle',name:'rectangle',c:'#ff8fb0',svg:'<rect x="4" y="24" width="92" height="52" rx="8"/>',face:[50,48]}
];
const face=([x,y])=>`<circle class="eye" cx="${x-11}" cy="${y-4}" r="5"/><circle class="eye" cx="${x+11}" cy="${y-4}" r="5"/>
  <circle class="shine" cx="${x-9}" cy="${y-6}" r="1.8"/><circle class="shine" cx="${x+13}" cy="${y-6}" r="1.8"/><path class="mouth" d="M${x-7} ${y+6} Q${x} ${y+12} ${x+7} ${y+6}"/>`;

/* ================= round setup ================= */
const holes=document.getElementById('holes'),tray=document.getElementById('tray'),sayEl=document.getElementById('say');
let round=0,matched=0,total=0,stars=0;try{stars=+localStorage.getItem('sk-shapes-stars')||0;}catch(_){}
document.getElementById('stars').textContent='⭐ '+stars;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function sizeFor(n){const w=innerWidth,h=innerHeight,land=w>h&&h<560;
  const byW=(land?w/2:w)/(n<=3?3.6:n<=4?2.6:3.4),byH=h/(land?3.6:(n<=4?5.6:7.2));return Math.round(Math.max(64,Math.min(150,byW,byH)));}
function newRound(){
  round++;matched=0;total=round<3?3:4;const pick=shuffle(SHAPES.slice()).slice(0,total);
  const s=sizeFor(total);document.documentElement.style.setProperty('--s',s+'px');document.documentElement.style.setProperty('--gap',Math.round(s*.22)+'px');
  holes.innerHTML=shuffle(pick.slice()).map(p=>`<div class="slot" data-id="${p.id}" style="--c:${p.c}"><svg viewBox="0 0 100 100">${p.svg}</svg></div>`).join('');
  tray.innerHTML=shuffle(pick.slice()).map(p=>`<div class="piece" data-id="${p.id}" style="--c:${p.c}"><svg viewBox="0 0 100 100">${p.svg}${face(p.face)}</svg></div>`).join('');
  sayEl.textContent='Drag each shape to its home!';
}

/* ================= drag and drop ================= */
let drag=null;
tray.addEventListener('pointerdown',e=>{
  const p=e.target.closest('.piece');if(!p||drag)return;audio();e.preventDefault();
  const r=p.getBoundingClientRect();drag={el:p,id:e.pointerId,ox:e.clientX-r.left,oy:e.clientY-r.top,startX:r.left,startY:r.top};
  p.setPointerCapture(e.pointerId);p.classList.add('drag');p.style.position='fixed';p.style.left=r.left+'px';p.style.top=r.top+'px';
  placeholder(p,r);tick(500+SHAPES.findIndex(s=>s.id===p.dataset.id)*40);
});
function placeholder(p,r){const ph=document.createElement('div');ph.className='piece home';ph.style.width=r.width+'px';ph.style.height=r.height+'px';
  p.parentNode.insertBefore(ph,p);drag.ph=ph;}
addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;drag.el.style.left=(e.clientX-drag.ox)+'px';drag.el.style.top=(e.clientY-drag.oy)+'px';
  const hit=slotAt(drag.el);holes.querySelectorAll('.slot').forEach(s=>s.classList.toggle('hover',s===hit));});
function slotAt(el){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bd=Infinity;
  holes.querySelectorAll('.slot:not(.filled)').forEach(s=>{const q=s.getBoundingClientRect(),d=Math.hypot(q.left+q.width/2-cx,q.top+q.height/2-cy);if(d<q.width*.62&&d<bd){bd=d;best=s;}});return best;}
function drop(e){
  if(!drag||e.pointerId!==drag.id)return;const{el,ph}=drag;const slot=slotAt(el);holes.querySelectorAll('.slot').forEach(s=>s.classList.remove('hover'));
  if(slot&&slot.dataset.id===el.dataset.id){
    slot.classList.add('filled');el.remove();ph.remove();matched++;const shape=SHAPES.find(s=>s.id===el.dataset.id);
    const q=slot.getBoundingClientRect();confetti(q.left+q.width/2,q.top+q.height/2,40);yay();speak(shape.name+'!');
    sayEl.textContent=['Yay! ','Great! ','You did it! ','Super! '][Math.floor(Math.random()*4)]+'That\'s a '+shape.name+'!';
    if(matched===total)setTimeout(finishRound,700);
  }else{
    if(slot){boop();el.classList.add('wiggle');sayEl.textContent='Hmm, try another home!';}
    el.style.transition='left .35s cubic-bezier(.3,1.4,.6,1), top .35s cubic-bezier(.3,1.4,.6,1)';
    const r=ph.getBoundingClientRect();el.style.left=r.left+'px';el.style.top=r.top+'px';
    setTimeout(()=>{el.style.position='';el.style.left='';el.style.top='';el.style.transition='';el.classList.remove('wiggle');ph.replaceWith(el);},380);
  }
  el.classList.remove('drag');drag=null;
}
addEventListener('pointerup',drop);addEventListener('pointercancel',drop);
function finishRound(){stars++;try{localStorage.setItem('sk-shapes-stars',stars);}catch(_){}document.getElementById('stars').textContent='⭐ '+stars;
  sayEl.textContent='🎉 All done! Great job! 🎉';for(let i=0;i<5;i++)setTimeout(()=>confetti(Math.random()*innerWidth,innerHeight*.3*Math.random(),60),i*220);
  fanfare();setTimeout(()=>speak('Great job!'),400);setTimeout(newRound,3200);}

/* ================= confetti + stars ================= */
const cf=document.getElementById('confetti'),cx=cf.getContext('2d');let bits=[],running=false,CW=0,CH=0;
function cfSize(){const d=Math.min(devicePixelRatio||1,2);CW=innerWidth;CH=innerHeight;cf.width=CW*d;cf.height=CH*d;cx.setTransform(d,0,0,d,0,0);}
cfSize();
const CCOL=['#ff6b9d','#ffd23f','#4dd6ff','#7ae582','#a78bfa','#ff9f43','#ffffff'];
function confetti(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=180+Math.random()*420;
  bits.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-220,r:Math.random()*6.283,vr:Math.random()*10-5,w:6+Math.random()*7,h:4+Math.random()*5,
    c:CCOL[i%CCOL.length],star:Math.random()<.3,life:1.8+Math.random()});}
  if(!running){running=true;let last=performance.now();const f=t=>{const dt=Math.min(.04,(t-last)/1000);last=t;cx.clearRect(0,0,CW,CH);
    for(let i=bits.length-1;i>=0;i--){const b=bits[i];b.life-=dt;if(b.life<=0||b.y>CH+40){bits.splice(i,1);continue;}
      b.vy+=600*dt;b.vx*=.985;b.x+=b.vx*dt;b.y+=b.vy*dt;b.r+=b.vr*dt;cx.save();cx.globalAlpha=Math.min(1,b.life);cx.translate(b.x,b.y);cx.rotate(b.r);cx.fillStyle=b.c;
      if(b.star){cx.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5,rr=k%2?b.w*.45:b.w;cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}cx.fill();}else cx.fillRect(-b.w/2,-b.h/2,b.w,b.h);cx.restore();}
    if(bits.length)requestAnimationFrame(f);else{running=false;cx.clearRect(0,0,CW,CH);}};requestAnimationFrame(f);}}

/* ================= sounds ================= */
let AC=null,soundOn=true;try{soundOn=localStorage.getItem('sk-shapes-sound')!=='off';}catch(_){}
function audio(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function note(f,t,d,v,type){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05);}
function tick(f){if(!audio()||!soundOn)return;note(f,AC.currentTime,.12,.12,'triangle');}
function yay(){if(!audio()||!soundOn)return;const t=AC.currentTime;[523,659,784,1047].forEach((f,i)=>{note(f,t+i*.08,.5,.22);note(f*2,t+i*.08,.3,.06);});}
function boop(){if(!audio()||!soundOn)return;const t=AC.currentTime;note(330,t,.18,.18,'triangle');note(262,t+.15,.3,.18,'triangle');}
function fanfare(){if(!audio()||!soundOn)return;const t=AC.currentTime;[[523,0],[659,.15],[784,.3],[1047,.45],[784,.65],[1047,.8]].forEach(([f,d])=>{note(f,t+d,.45,.2,'triangle');note(f/2,t+d,.4,.1);});}
let voiceCache=null;
function voice(){if(voiceCache)return voiceCache;const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];const en=vs.filter(v=>/^en/i.test(v.lang));
  for(const p of['Google UK English Female','Samantha','Microsoft Ava','Microsoft Jenny','Microsoft Aria','Karen','Tessa','Moira','Zira','Google US English']){const v=en.find(v=>v.name.includes(p));if(v)return voiceCache=v;}
  return voiceCache=en.find(v=>/female/i.test(v.name))||en[0]||null;}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{voiceCache=null;};
function speak(text){if(!soundOn||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=voice();
  if(v){u.voice=v;u.lang=v.lang;}u.pitch=1.25;u.rate=.95;setTimeout(()=>speechSynthesis.speak(u),250);}
const soundBtn=document.getElementById('soundBtn');const paint=()=>soundBtn.textContent=soundOn?'🔊':'🔇';paint();
soundBtn.onclick=()=>{soundOn=!soundOn;paint();try{localStorage.setItem('sk-shapes-sound',soundOn?'on':'off');}catch(_){}};

/* ================= stars background ================= */
(function(){const c=document.getElementById('sky'),x=c.getContext('2d');let W,H,st=[],last=0;
  function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
    st=Array.from({length:Math.round(W*H/3200)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.3,a:Math.random()*.5+.25,s:Math.random()<.2?Math.random()+.4:0,p:Math.random()*6}));}
  function f(t){requestAnimationFrame(f);if(document.hidden||t-last<60)return;last=t;x.clearRect(0,0,W,H);
    for(const s of st){x.globalAlpha=s.s?s.a*(.6+.4*Math.sin(t/1000*s.s+s.p)):s.a;x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill();}}
  addEventListener('resize',size);size();requestAnimationFrame(f);})();

let rz;addEventListener('resize',()=>{cfSize();clearTimeout(rz);rz=setTimeout(()=>{const s=sizeFor(total);document.documentElement.style.setProperty('--s',s+'px');
  document.documentElement.style.setProperty('--gap',Math.round(s*.22)+'px');},150);});
newRound();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{}));
</script>
</body>
</html>
